      summary: 'Attendance grid for one week'
      description: |
        Derived per day: holiday, weekly off, approved leave, check-in (office or home), else ABSENT for past working days.
      parameters:
        - { name: week, in: query, schema: { type: string, format: date }, description: 'Any day of the week (Monday start); default this week' }
