            application/json:
              schema: { $ref: '#/components/schemas/ClientReport' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /admin/reports:
    get:
      tags: [reports]
