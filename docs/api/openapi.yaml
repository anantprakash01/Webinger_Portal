      tags: [people]
      summary: 'Scorecards for the team (last 30 days)'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Scorecard' } }
        '403': { $ref: '#/components/responses/Problem' }
  /people/{id}/scorecard:
    get:
      tags: [people]
      summary: 'One scorecard with a six-month trend'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scorecard' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /me/attendance:
    get:
