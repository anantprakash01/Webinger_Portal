        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAttendance' }
        '403': { $ref: '#/components/responses/Problem' }
  /me/attendance/check-in:
    post:
      tags: [me]
      summary: 'Check in (office or home), once a day'
      description: |
        409 on a weekly off or holiday, on approved leave, or when already checked in.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [OFFICE, WFH] } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAttendance' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/attendance/check-out:
    post:
      tags: [me]
      summary: 'Check out'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyAttendance' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/leave:
    get:
      tags: [me]
      summary: 'Balances, requests and coming holidays'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyLeave' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [me]
      summary: 'Apply for leave'
      description: |
        Working days only (Settings business days, holidays excluded). Sick leave up to 7 days back; others from today.
        Max 20 working days, 6 months ahead. 409 on overlap or not enough balance (unpaid has no cap).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLeave' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/leave/{id}/cancel:
    post:
      tags: [me]
      summary: 'Cancel a pending request, or approved leave that has not started'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/performance:
    get:
      tags: [me]
      summary: 'Your own scorecard'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Scorecard' }
        '403': { $ref: '#/components/responses/Problem' }
  /me/timesheet:
    get:
      tags: [me]
      summary: 'One week of your time, the running timer and your projects'
      parameters:
        - { name: week, in: query, schema: { type: string, format: date }, description: 'Any day of the week (Monday start); default this week' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timesheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /me/timesheet/submit:
    post:
      tags: [me]
      summary: 'Submit (lock) a week'
      description: |
        409 when already submitted or a timer is running; 400 when nothing is logged. Phase 2 adds manager approval.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [weekStart], properties: { weekStart: { type: string, format: date } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Timesheet' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/time-entries:
    post:
      tags: [me]
      summary: 'Add time manually'
      description: |
        Only on active projects you work on; 5 min to 12 h per entry, 16 h a day; not in the future or more than 30 days back;
        409 in a submitted week. Hours add to the project (80% and 100% budget alerts, rule 14).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTimeEntry' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/time-entries/{id}:
    delete:
      tags: [me]
      summary: 'Delete one of your entries'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Done }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/timer/start:
    post:
      tags: [me]
      summary: 'Start the timer (one at a time; the server keeps the start time)'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TimerStart' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeEntry' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /me/timer/stop:
    post:
      tags: [me]
      summary: 'Stop the timer and log it'
      description: |
        Under a minute is discarded (response null); over 10 hours is capped with a note.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TimeEntry' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Problem:
      description: Error in RFC 9457 format (Spring ProblemDetail)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [status, title]
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }

    Role:
      type: string
      enum: [SUPER_ADMIN, MANAGER, EMPLOYEE, CLIENT_OWNER, CLIENT_REP, INFLUENCER, PARTNER]
    Health: { type: string, enum: [GREEN, AMBER, RED] }
    TaskStatus: { type: string, enum: [TODO, IN_PROGRESS, IN_REVIEW, CLIENT_APPROVAL, DONE] }
    InvoiceStatus: { type: string, enum: [DRAFT, SENT, PAID, OVERDUE, CANCELLED] }
    ProjectStatus: { type: string, enum: [ACTIVE, ON_HOLD, COMPLETED] }
    Priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
    Visibility:
      type: string
      enum: [INTERNAL, CLIENT]
      description: INTERNAL items are never returned to client roles. Default INTERNAL.
    MilestoneStatus: { type: string, enum: [DONE, UPCOMING, MISSED] }
    DeliverableStatus: { type: string, enum: [PLANNED, IN_PROGRESS, IN_REVIEW, CLIENT_APPROVAL, APPROVED] }

    User:
      type: object
      required: [id, name, email, role, organisationId, organisationName]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        organisationId: { type: string }
        organisationName: { type: string }
        title: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [BILLING_VIEW, TEAM_MANAGE] }
          description: Grants on top of the role
    Session:
      type: object
      required: [user, accessToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }

    Milestone:
      type: object
      required: [title, due]
      properties:
        title: { type: string }
        due: { type: string, format: date }
    ProjectSummary:
      type: object
      required: [id, name, clientName, service, progress, health, owner]
      properties:
        id: { type: string }
        name: { type: string }
        clientName: { type: string }
        service: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        health: { $ref: '#/components/schemas/Health' }
        nextMilestone: { $ref: '#/components/schemas/Milestone' }
        owner: { type: string }
    TaskItem:
      type: object
      required: [id, title, projectId, projectName, clientName, status, priority, due, assigneeId, assigneeName]
      properties:
        id: { type: string }
        title: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        clientName: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        due: { type: string, format: date }
        assigneeId: { type: string }
        assigneeName: { type: string }
        checklistDone: { type: integer }
        checklistTotal: { type: integer }
        commentCount: { type: integer }
        reviewerId: { type: string }
    Approval:
      type: object
      required: [id, title, projectName, submittedAt, revisionsUsed, revisionsAllowed]
      properties:
        id: { type: string }
        title: { type: string }
        projectName: { type: string }
        submittedAt: { type: string, format: date-time }
        revisionsUsed: { type: integer }
        revisionsAllowed: { type: integer }
    InvoiceSummary:
      type: object
      required: [id, number, clientName, amount, due, status]
      properties:
        id: { type: string }
        number: { type: string }
        clientName: { type: string }
        amount: { type: number, description: Amount in INR including GST }
        due: { type: string, format: date }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
    MessagePreview:
      type: object
      required: [id, from, projectName, text, at, unread]
      properties:
        id: { type: string }
        from: { type: string }
        projectName: { type: string }
        text: { type: string }
        at: { type: string, format: date-time }
        unread: { type: boolean }
    KpiPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        good: { type: boolean }

    AdminDashboard:
      type: object
      required: [revenueThisMonth, recurringRevenue, outstanding, overdueTasks, activeClients, satisfaction, healthMix, projectsAtRisk, overdueInvoices, teamLoad, pipeline, waitingOnYou]
      properties:
        revenueThisMonth: { type: number }
        recurringRevenue: { type: number }
        outstanding: { type: number }
        overdueTasks: { type: integer }
        activeClients: { type: integer }
        satisfaction: { type: number }
        healthMix:
          type: object
          properties:
            GREEN: { type: integer }
            AMBER: { type: integer }
            RED: { type: integer }
        projectsAtRisk: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        overdueInvoices: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } }
        teamLoad:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              department: { type: string }
              assignedHours: { type: number }
              capacityHours: { type: number }
        pipeline:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              count: { type: integer }
              value: { type: number }
        waitingOnYou:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              kind: { type: string, enum: [PAYOUT, DISCOUNT, PAUSE, LEAVE] }

    ClientDashboard:
      type: object
      required: [accountManager, projects, approvals, unpaidInvoices, results, resultsPeriod, messages]
      properties:
        accountManager:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            hours: { type: string }
        projects: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        unpaidInvoices: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } }
        results: { type: array, items: { $ref: '#/components/schemas/KpiPoint' } }
        resultsPeriod: { type: string }
        messages: { type: array, items: { $ref: '#/components/schemas/MessagePreview' } }
        offer:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            text: { type: string }
            cta: { type: string }

    EmployeeDashboard:
      type: object
      required: [today, thisWeek, reviewQueue, messages, scorecard, announcements]
      properties:
        today: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        thisWeek: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        reviewQueue: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        messages: { type: array, items: { $ref: '#/components/schemas/MessagePreview' } }
        scorecard:
          type: object
          properties:
            onTimeRate: { type: number }
            firstPassQuality: { type: number }
            clientRating: { type: number }
            hoursLogged: { type: number }
            hoursCapacity: { type: number }
        announcements:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              at: { type: string, format: date }

    InfluencerDashboard:
      type: object
      required: [verification, profileCompleteness, invites, active, payouts]
      properties:
        verification: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        profileCompleteness: { type: integer }
        invites:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              brand: { type: string }
              campaign: { type: string }
              deliverable: { type: string }
              fee: { type: number }
              respondBy: { type: string, format: date }
        active:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              brand: { type: string }
              campaign: { type: string }
              step: { type: string }
              due: { type: string, format: date }
        payouts:
          type: object
          properties:
            pending: { type: number }
            paidThisYear: { type: number }

    PartnerDashboard:
      type: object
      required: [briefs, invoices]
      properties:
        briefs:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              projectName: { type: string }
              due: { type: string, format: date }
              status: { type: string, enum: [NEW, IN_PROGRESS, SUBMITTED, APPROVED] }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              number: { type: string }
              amount: { type: number }
              status: { $ref: '#/components/schemas/InvoiceStatus' }

    # ---------- Week 2: projects and tasks ----------
    ProjectListItem:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [status, clientId, ownerId, startDate]
          properties:
            status: { $ref: '#/components/schemas/ProjectStatus' }
            clientId: { type: string, description: The client organisation id }
            ownerId: { type: string }
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            openTasks: { type: integer, description: Staff only }
            overdueTasks: { type: integer, description: Staff only }
    ProjectPage:
      type: object
      required: [items, page, size, totalItems, totalPages, facets]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectListItem' } }
        page: { type: integer, description: Zero-based }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        facets:
          type: object
          description: Filter choices drawn from every project the caller may see, not just this page
          required: [services, owners, clients]
          properties:
            services: { type: array, items: { type: string } }
            owners: { type: array, items: { $ref: '#/components/schemas/IdName' } }
            clients: { type: array, items: { $ref: '#/components/schemas/IdName' } }
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    MilestoneItem:
      type: object
      required: [id, title, due, status]
      properties:
        id: { type: string }
        title: { type: string }
        due: { type: string, format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }
        completedAt: { type: string, format: date }
    Deliverable:
      type: object
      required: [id, title, status, due, revisionsUsed, revisionsAllowed]
      properties:
        id: { type: string }
        title: { type: string }
        milestoneId: { type: string }
        status: { $ref: '#/components/schemas/DeliverableStatus' }
        due: { type: string, format: date }
        revisionsUsed: { type: integer }
        revisionsAllowed: { type: integer }
    TeamMember:
      type: object
      required: [id, name, title, projectRole]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        projectRole: { type: string, enum: [OWNER, BACKUP, MEMBER, CLIENT] }
    ActivityItem:
      type: object
      required: [id, at, actor, text, visibility]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        text: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectListItem'
        - type: object
          required: [scope, milestones, deliverables, team, activity]
          properties:
            scope: { type: string }
            milestones: { type: array, items: { $ref: '#/components/schemas/MilestoneItem' } }
            deliverables: { type: array, items: { $ref: '#/components/schemas/Deliverable' } }
            team: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
            activity: { type: array, items: { $ref: '#/components/schemas/ActivityItem' }, description: Newest first }
            tasks: { type: array, items: { $ref: '#/components/schemas/TaskItem' }, description: Staff only }
            budgetHours: { type: number, description: Admin area only }
            hoursUsed: { type: number, description: Admin area only }
    ChecklistItem:
      type: object
      required: [id, text, done]
      properties:
        id: { type: string }
        text: { type: string }
        done: { type: boolean }
    TaskFile:
      type: object
      required: [id, name, sizeKb, uploadedBy, uploadedAt, visibility]
      properties:
        id: { type: string }
        name: { type: string }
        sizeKb: { type: integer }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        visibility: { $ref: '#/components/schemas/Visibility' }
    TaskComment:
      type: object
      required: [id, authorId, author, at, text, visibility]
      properties:
        id: { type: string }
        authorId: { type: string }
        author: { type: string }
        at: { type: string, format: date-time }
        text: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskItem'
        - type: object
          required: [description, clientFacing, checklist, files, comments, createdAt]
          properties:
            description: { type: string }
            reviewerId: { type: string }
            reviewerName: { type: string }
            clientFacing: { type: boolean, description: Must pass internal review before reaching the client }
            checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
            files: { type: array, items: { $ref: '#/components/schemas/TaskFile' } }
            comments: { type: array, items: { $ref: '#/components/schemas/TaskComment' }, description: Oldest first }
            createdAt: { type: string, format: date-time }
    TaskPatch:
      type: object
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/TaskStatus' }
        assigneeId: { type: string }
        due: { type: string, format: date }
    NewComment:
      type: object
      required: [text, visibility]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        visibility: { $ref: '#/components/schemas/Visibility' }

    # ---------- Week 3 ----------
    MfaChallenge:
      type: object
      required: [mfaRequired, mfaToken, method]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        mfaToken: { type: string }
        method: { type: string }
    InviteInfo:
      type: object
      required: [name, email, role, organisationName, expiresAt]
      properties:
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        organisationName: { type: string }
        expiresAt: { type: string, format: date-time }
    ReviewInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [PASS, FAIL] }
        note: { type: string, maxLength: 2000, description: Required (5+ characters) for FAIL }
    ApprovalStatus: { type: string, enum: [PENDING, APPROVED, CHANGES_REQUESTED] }
    AssetKind: { type: string, enum: [IMAGE, PDF] }
    ApprovalItem:
      type: object
      required: [id, title, projectId, projectName, kind, status, versionNumber, submittedAt, thumbnailUrl, revisionsUsed, revisionsAllowed, commentCount]
      properties:
        id: { type: string }
        title: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        kind: { $ref: '#/components/schemas/AssetKind' }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        versionNumber: { type: integer }
        submittedAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, description: Short-lived signed link }
        revisionsUsed: { type: integer }
        revisionsAllowed: { type: integer }
        commentCount: { type: integer }
    ApprovalDecision:
      type: object
      required: [status, byName, at]
      properties:
        status: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
        byName: { type: string }
        at: { type: string, format: date-time }
        note: { type: string }
    AssetVersion:
      type: object
      required: [id, number, fileName, pages, submittedAt, submittedBy]
      properties:
        id: { type: string }
        number: { type: integer }
        fileName: { type: string }
        pages: { type: array, items: { type: string }, description: Preview image per page (PDFs rendered server-side), signed links }
        submittedAt: { type: string, format: date-time }
        submittedBy: { type: string }
        note: { type: string }
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
    PinComment:
      type: object
      required: [id, versionId, page, x, y, authorId, author, fromAgency, at, text]
      properties:
        id: { type: string }
        versionId: { type: string }
        page: { type: integer, minimum: 0 }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        authorId: { type: string }
        author: { type: string }
        fromAgency: { type: boolean }
        at: { type: string, format: date-time }
        text: { type: string }
    ApprovalDetail:
      allOf:
        - $ref: '#/components/schemas/ApprovalItem'
        - type: object
          required: [deliverableId, clientName, versions, comments]
          properties:
            deliverableId: { type: string }
            clientName: { type: string }
            versions: { type: array, items: { $ref: '#/components/schemas/AssetVersion' }, description: Oldest first }
            comments: { type: array, items: { $ref: '#/components/schemas/PinComment' }, description: Oldest first }
    ApprovalDecisionInput:
      type: object
      required: [versionId, decision]
      properties:
        versionId: { type: string }
        decision: { type: string, enum: [APPROVE, REQUEST_CHANGES] }
        note: { type: string, maxLength: 2000, description: Required (5+ characters) for REQUEST_CHANGES }
    NewPinComment:
      type: object
      required: [versionId, page, x, y, text]
      properties:
        versionId: { type: string }
        page: { type: integer, minimum: 0 }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        text: { type: string, minLength: 1, maxLength: 1000 }
    AccountStatus: { type: string, enum: [ACTIVE, INVITED, PENDING_APPROVAL, SUSPENDED] }
    ClientTeamMember:
      type: object
      required: [id, name, email, role, status, projectIds, canSeeBilling]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        title: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        projectIds: { type: array, items: { type: string } }
        canSeeBilling: { type: boolean }
        invitedAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    ClientTeam:
      type: object
      required: [members, projects]
      properties:
        members: { type: array, items: { $ref: '#/components/schemas/ClientTeamMember' } }
        projects: { type: array, items: { $ref: '#/components/schemas/IdName' } }
    RepInvite:
      type: object
      required: [name, email, projectIds, canSeeBilling]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        title: { type: string }
        projectIds: { type: array, minItems: 1, items: { type: string } }
        canSeeBilling: { type: boolean }
    RepPatch:
      type: object
      minProperties: 1
      properties:
        projectIds: { type: array, minItems: 1, items: { type: string } }
        canSeeBilling: { type: boolean }
        suspended: { type: boolean }
    AdminUser:
      type: object
      required: [id, name, email, role, organisationId, organisationName, status, mfaEnabled, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        organisationId: { type: string }
        organisationName: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        mfaEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
        invitedBy: { type: string }
    UserInvite:
      type: object
      required: [name, email, role, organisationId]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        organisationId: { type: string }
        title: { type: string }
    Organisation:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [AGENCY, CLIENT, INFLUENCER, PARTNER] }
    LoginEvent:
      type: object
      required: [id, userName, email, at, result, ip, device]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        email: { type: string }
        at: { type: string, format: date-time }
        result: { type: string, enum: [SUCCESS, FAILED, MFA_FAILED, LOCKED] }
        ip: { type: string }
        device: { type: string }
    PortalSettings:
      type: object
      required: [businessHours, responseTimes, approvalLimits, defaultRevisions, reminderAfterDays]
      properties:
        businessHours:
          type: object
          required: [days, open, close, timezone]
          properties:
            days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0 = Sunday }
            open: { type: string, pattern: '^\\d{2}:\\d{2}$' }
            close: { type: string, pattern: '^\\d{2}:\\d{2}$' }
            timezone: { type: string }
        responseTimes:
          type: object
          required: [firstReplyHours, ticketResolutionHours]
          properties:
            firstReplyHours: { type: integer }
            ticketResolutionHours: { type: integer }
        approvalLimits:
          type: object
          required: [managerDiscountPercent, managerSpendLimit, deputyPayoutLimit]
          properties:
            managerDiscountPercent: { type: number }
            managerSpendLimit: { type: number, description: INR }
            deputyPayoutLimit: { type: number, description: INR }
        defaultRevisions: { type: integer }
        reminderAfterDays: { type: integer }

    # ---------- Week 4 ----------
    Attachment:
      type: object
      required: [id, name, sizeKb, kind]
      properties:
        id: { type: string }
        name: { type: string }
        sizeKb: { type: integer }
        kind: { type: string, enum: [IMAGE, PDF, DOC, OTHER] }
        url: { type: string, description: Short-lived signed link }
    ReadReceipt:
      type: object
      required: [userId, name, at]
      properties:
        userId: { type: string }
        name: { type: string }
        at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, conversationId, authorId, authorName, fromAgency, at, text, internal, attachments, readBy]
      properties:
        id: { type: string }
        conversationId: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        fromAgency: { type: boolean }
        at: { type: string, format: date-time }
        text: { type: string }
        internal: { type: boolean, description: Staff-only note; never sent to client roles }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        readBy: { type: array, items: { $ref: '#/components/schemas/ReadReceipt' } }
        ticketId: { type: string }
        ticketNumber: { type: string }
    Conversation:
      type: object
      required: [id, kind, title, unreadCount, openTickets, members]
      properties:
        id: { type: string }
        kind: { type: string, enum: [PROJECT, TEAM] }
        title: { type: string }
        projectId: { type: string }
        clientName: { type: string }
        unreadCount: { type: integer }
        lastMessage:
          type: object
          properties:
            text: { type: string }
            at: { type: string, format: date-time }
            authorName: { type: string }
            internal: { type: boolean }
        awaitingReply:
          type: object
          description: Staff only
          properties:
            since: { type: string, format: date-time }
            dueAt: { type: string, format: date-time }
        openTickets: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              fromAgency: { type: boolean }
    NewMessage:
      type: object
      required: [text, internal, attachmentIds]
      properties:
        text: { type: string, maxLength: 4000 }
        internal: { type: boolean }
        attachmentIds: { type: array, maxItems: 5, items: { type: string } }
    TicketStatus: { type: string, enum: [OPEN, WAITING_ON_CLIENT, RESOLVED] }
    Ticket:
      type: object
      required: [id, number, title, conversationId, messageId, projectName, clientName, status, priority, assigneeId, assigneeName, createdAt, createdBy, firstResponseDueAt, resolveDueAt]
      properties:
        id: { type: string }
        number: { type: string, example: TCK-0042 }
        title: { type: string }
        conversationId: { type: string }
        messageId: { type: string }
        projectName: { type: string }
        clientName: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        assigneeId: { type: string }
        assigneeName: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        firstResponseDueAt: { type: string, format: date-time }
        firstRespondedAt: { type: string, format: date-time }
        resolveDueAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    NewTicket:
      type: object
      required: [title, priority]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        priority: { $ref: '#/components/schemas/Priority' }
    TicketPatch:
      type: object
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/TicketStatus' }
        assigneeId: { type: string }
    Availability:
      type: object
      required: [openNow, hoursText, firstReplyHours]
      properties:
        openNow: { type: boolean }
        opensAt: { type: string, format: date-time }
        hoursText: { type: string, example: 'Mon–Sat, 10:00–19:00 IST' }
        firstReplyHours: { type: integer }
    FileFolder: { type: string, enum: [LOGOS, FONTS, GUIDELINES, PHOTOS, DELIVERABLES] }
    FileVersion:
      type: object
      required: [number, sizeKb, uploadedAt, uploadedBy]
      properties:
        number: { type: integer }
        sizeKb: { type: integer }
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { type: string }
        note: { type: string }
        previewUrl: { type: string }
    FileItem:
      type: object
      required: [id, name, folder, kind, currentVersion, versionCount, sizeKb, updatedAt, updatedBy]
      properties:
        id: { type: string }
        name: { type: string }
        folder: { $ref: '#/components/schemas/FileFolder' }
        kind: { type: string, enum: [IMAGE, PDF, DOC, OTHER, FONT] }
        projectId: { type: string }
        projectName: { type: string }
        currentVersion: { type: integer }
        versionCount: { type: integer }
        sizeKb: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        previewUrl: { type: string }
    FileDetail:
      allOf:
        - $ref: '#/components/schemas/FileItem'
        - type: object
          required: [versions]
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/FileVersion' }, description: Newest first }
    DownloadLink:
      type: object
      required: [url, fileName, expiresAt]
      properties:
        url: { type: string }
        fileName: { type: string }
        expiresAt: { type: string, format: date-time }

    # ---------- Admin: clients (0.4.1) ----------
    ClientStatus: { type: string, enum: [ONBOARDING, ACTIVE, PAUSED, ENDED] }
    ClientListItem:
      type: object
      required: [id, name, industry, city, status, clientSince, accountManager, activeProjects, totalProjects, services, health, healthScore, monthlyRetainer, outstanding]
      properties:
        id: { type: string, description: organisationId }
        name: { type: string }
        industry: { type: string }
        city: { type: string }
        status: { $ref: '#/components/schemas/ClientStatus' }
        clientSince: { type: string, format: date }
        accountManager: { type: object, properties: { id: { type: string }, name: { type: string } } }
        activeProjects: { type: integer }
        totalProjects: { type: integer }
        services: { type: array, items: { type: string } }
        health: { $ref: '#/components/schemas/Health' }
        healthScore: { type: integer, minimum: 0, maximum: 100 }
        monthlyRetainer: { type: number, description: Running retainer contracts, INR before GST }
        outstanding: { type: number, description: Unpaid invoices, INR }
        renewalDue: { type: string, format: date, description: Earliest end date of a running contract }
    HealthFactor:
      type: object
      required: [key, label, level, detail, penalty]
      properties:
        key: { type: string, enum: [OVERDUE_TASKS, SLOW_APPROVALS, MISSED_MILESTONES, LATE_INVOICE, SATISFACTION] }
        label: { type: string }
        level: { type: string, enum: [OK, AMBER, RED] }
        detail: { type: string }
        penalty: { type: integer }
    ClientContact:
      type: object
      required: [id, name, email, role, status, canSeeBilling]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        email: { type: string }
        role: { type: string, enum: [CLIENT_OWNER, CLIENT_REP] }
        status: { $ref: '#/components/schemas/AccountStatus' }
        lastLoginAt: { type: string, format: date-time }
        canSeeBilling: { type: boolean }
    ClientContract:
      type: object
      required: [id, title, kind, startDate, endDate, value, revisionsPerDeliverable, status]
      properties:
        id: { type: string }
        title: { type: string }
        kind: { type: string, enum: [RETAINER, PROJECT] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        value: { type: number, description: Monthly for retainers, total for projects; INR before GST }
        revisionsPerDeliverable: { type: integer }
        status: { type: string, enum: [ACTIVE, ENDING_SOON, ENDED], description: ENDING_SOON within 30 days of endDate }
    ClientHistoryItem:
      type: object
      required: [id, at, actor, kind, text]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        kind: { type: string, enum: [CREATED, CONTRACT, PROJECT, INVOICE, APPROVAL, NOTE, STATUS, CHANGE] }
        text: { type: string }
    ClientDetail:
      allOf:
        - $ref: '#/components/schemas/ClientListItem'
        - type: object
          required: [legalName, address, healthFactors, contacts, contracts, projects, history]
          properties:
            legalName: { type: string }
            gstin: { type: string, pattern: '^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$' }
            website: { type: string }
            address: { type: string }
            backupManager: { type: object, properties: { id: { type: string }, name: { type: string } } }
            satisfaction: { type: number, description: Average milestone rating 1-5 }
            approvalDays: { type: number, description: Average days from sent-for-approval to decision }
            healthFactors: { type: array, items: { $ref: '#/components/schemas/HealthFactor' } }
            contacts: { type: array, items: { $ref: '#/components/schemas/ClientContact' } }
            contracts: { type: array, items: { $ref: '#/components/schemas/ClientContract' } }
            projects: { type: array, items: { $ref: '#/components/schemas/ProjectListItem' } }
            history: { type: array, items: { $ref: '#/components/schemas/ClientHistoryItem' }, description: Newest first }
            lifetimeValue: { type: number, description: SUPER_ADMIN only; never sent to managers }
    NewClient:
      type: object
      required: [name, legalName, industry, city, accountManagerId, owner]
      properties:
        name: { type: string, minLength: 2 }
        legalName: { type: string }
        industry: { type: string }
        city: { type: string }
        gstin: { type: string }
        website: { type: string }
        accountManagerId: { type: string }
        owner:
          type: object
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string, format: email }
            title: { type: string }
    ClientPatch:
      type: object
      minProperties: 1
      properties:
        industry: { type: string }
        city: { type: string }
        gstin: { type: string, description: Empty string clears it }
        website: { type: string }
        address: { type: string }
        accountManagerId: { type: string }
        backupManagerId: { type: string, description: Empty string removes the backup }
        status: { $ref: '#/components/schemas/ClientStatus' }

    # ---------- Finance, billing, reports (0.5.0) ----------
    QuoteStatus: { type: string, enum: [DRAFT, SENT, ACCEPTED, DECLINED, EXPIRED], description: EXPIRED is derived (SENT past validUntil) }
    PaymentMethod: { type: string, enum: [BANK_TRANSFER, UPI, CHEQUE, CARD, ONLINE] }
    ExpenseCategory: { type: string, enum: [FREELANCER, PRODUCTION, SOFTWARE, MEDIA, TRAVEL, OFFICE] }
    Party:
      type: object
      required: [name, legalName, address, stateCode, stateName]
      properties:
        name: { type: string }
        legalName: { type: string }
        gstin: { type: string }
        address: { type: string }
        stateCode: { type: string, description: GST state code, e.g. 27 }
        stateName: { type: string }
    LineItemInput:
      type: object
      required: [description, quantity, rate]
      properties:
        description: { type: string, minLength: 2 }
        sac: { type: string, pattern: '^\d{6}$', description: Defaults to 998361 }
        quantity: { type: number, exclusiveMinimum: 0, maximum: 1000 }
        rate: { type: number, exclusiveMinimum: 0, description: INR before GST }
        projectId: { type: string }
    LineItem:
      allOf:
        - $ref: '#/components/schemas/LineItemInput'
        - type: object
          required: [amount]
          properties:
            projectName: { type: string }
            amount: { type: number }
    TaxLine:
      type: object
      required: [label, rate, amount]
      properties:
        label: { type: string, enum: [CGST, SGST, IGST] }
        rate: { type: number }
        amount: { type: number }
    InvoiceListItem:
      type: object
      required: [id, clientId, clientName, title, due, status, subtotal, tax, total, paid, balance]
      properties:
        id: { type: string }
        number: { type: string, description: Given when sent }
        clientId: { type: string }
        clientName: { type: string }
        title: { type: string }
        issueDate: { type: string, format: date }
        due: { type: string, format: date }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
        paid: { type: number, description: Payments plus TDS }
        balance: { type: number }
        daysLate: { type: integer }
    InvoicePayment:
      type: object
      required: [id, receiptNumber, date, amount, tds, method, recordedBy]
      properties:
        id: { type: string }
        receiptNumber: { type: string }
        date: { type: string, format: date }
        amount: { type: number }
        tds: { type: number }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        reference: { type: string }
        recordedBy: { type: string }
    FinanceEvent:
      type: object
      required: [id, at, actor, text]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        text: { type: string }
    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/InvoiceListItem'
        - type: object
          required: [seller, buyer, placeOfSupply, items, taxes, amountInWords, payments, payTo]
          properties:
            seller: { $ref: '#/components/schemas/Party' }
            buyer: { $ref: '#/components/schemas/Party' }
            placeOfSupply: { type: string }
            items: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
            taxes: { type: array, items: { $ref: '#/components/schemas/TaxLine' } }
            amountInWords: { type: string }
            notes: { type: string }
            payments: { type: array, items: { $ref: '#/components/schemas/InvoicePayment' } }
            cancelReason: { type: string }
            events: { type: array, items: { $ref: '#/components/schemas/FinanceEvent' }, description: Staff only }
            payTo: { type: object, properties: { bank: { type: string }, account: { type: string }, ifsc: { type: string }, upi: { type: string } } }
    NewInvoice:
      type: object
      required: [clientId, title, due, items]
      properties:
        clientId: { type: string }
        title: { type: string, minLength: 3 }
        due: { type: string, format: date }
        items: { type: array, minItems: 1, maxItems: 20, items: { $ref: '#/components/schemas/LineItemInput' } }
        notes: { type: string }
    PaymentInput:
      type: object
      required: [date, amount, method]
      properties:
        date: { type: string, format: date }
        amount: { type: number, exclusiveMinimum: 0 }
        tds: { type: number, minimum: 0 }
        method: { $ref: '#/components/schemas/PaymentMethod' }
        reference: { type: string }
    QuoteListItem:
      type: object
      required: [id, number, clientId, clientName, title, kind, subtotal, total, validUntil, status]
      properties:
        id: { type: string }
        number: { type: string }
        clientId: { type: string }
        clientName: { type: string }
        title: { type: string }
        kind: { type: string, enum: [RETAINER, PROJECT] }
        subtotal: { type: number, description: Monthly for retainers }
        total: { type: number }
        validUntil: { type: string, format: date }
        status: { $ref: '#/components/schemas/QuoteStatus' }
        sentAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decidedBy: { type: string }
    QuoteDetail:
      allOf:
        - $ref: '#/components/schemas/QuoteListItem'
        - type: object
          required: [seller, buyer, items, taxes, revisionsPerDeliverable]
          properties:
            seller: { $ref: '#/components/schemas/Party' }
            buyer: { $ref: '#/components/schemas/Party' }
            items: { type: array, items: { $ref: '#/components/schemas/LineItem' } }
            taxes: { type: array, items: { $ref: '#/components/schemas/TaxLine' } }
            termMonths: { type: integer }
            revisionsPerDeliverable: { type: integer }
            notes: { type: string }
            declineReason: { type: string }
            contractId: { type: string }
            advanceInvoiceId: { type: string }
            events: { type: array, items: { $ref: '#/components/schemas/FinanceEvent' }, description: Staff only }
    NewQuote:
      type: object
      required: [clientId, title, kind, revisionsPerDeliverable, validDays, items]
      properties:
        clientId: { type: string }
        title: { type: string }
        kind: { type: string, enum: [RETAINER, PROJECT] }
        termMonths: { type: integer, minimum: 1, maximum: 36 }
        revisionsPerDeliverable: { type: integer, minimum: 0, maximum: 10 }
        validDays: { type: integer, minimum: 1, maximum: 90 }
        items: { type: array, minItems: 1, items: { $ref: '#/components/schemas/LineItemInput' } }
        notes: { type: string }
    PaymentItem:
      allOf:
        - $ref: '#/components/schemas/InvoicePayment'
        - type: object
          required: [invoiceId, invoiceNumber, clientId, clientName]
          properties:
            invoiceId: { type: string }
            invoiceNumber: { type: string }
            clientId: { type: string }
            clientName: { type: string }
    ExpenseItem:
      type: object
      required: [id, date, category, vendor, description, amount, gst, recordedBy]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        vendor: { type: string }
        description: { type: string }
        amount: { type: number, description: Before GST }
        gst: { type: number, description: Input GST }
        projectId: { type: string }
        projectName: { type: string }
        clientName: { type: string }
        recordedBy: { type: string }
    NewExpense:
      type: object
      required: [date, category, vendor, description, amount]
      properties:
        date: { type: string, format: date }
        category: { $ref: '#/components/schemas/ExpenseCategory' }
        vendor: { type: string }
        description: { type: string }
        amount: { type: number, exclusiveMinimum: 0 }
        gst: { type: number, minimum: 0 }
        projectId: { type: string }
    FinanceSummary:
      type: object
      required: [collectedThisMonth, invoicedThisMonth, recurringRevenue, outstanding, overdue, overdueCount, expensesThisMonth, draftInvoices, openQuotes, months, byService]
      properties:
        collectedThisMonth: { type: number }
        invoicedThisMonth: { type: number, description: Before GST }
        recurringRevenue: { type: number }
        outstanding: { type: number }
        overdue: { type: number }
        overdueCount: { type: integer }
        daysToCollect: { type: integer }
        expensesThisMonth: { type: number }
        draftInvoices: { type: integer }
        openQuotes: { type: object, properties: { count: { type: integer }, value: { type: number } } }
        winRate: { type: number, minimum: 0, maximum: 1 }
        months:
          type: array
          description: Last 6 months. invoiced incl. GST; collected incl. TDS credit; expenses before GST.
          items: { type: object, properties: { month: { type: string }, invoiced: { type: number }, collected: { type: number }, expenses: { type: number } } }
        byService: { type: array, items: { type: object, properties: { service: { type: string }, amount: { type: number } } } }
    ProfitRow:
      type: object
      required: [id, name, revenue, hours, labourCost, directCost, profit]
      properties:
        id: { type: string }
        name: { type: string }
        clientName: { type: string }
        service: { type: string }
        revenue: { type: number }
        hours: { type: number }
        labourCost: { type: number }
        directCost: { type: number }
        profit: { type: number }
        margin: { type: number, description: profit / revenue; absent when nothing is invoiced }
    ProfitReport:
      type: object
      required: [clients, projects]
      properties:
        clients: { type: array, items: { $ref: '#/components/schemas/ProfitRow' } }
        projects: { type: array, items: { $ref: '#/components/schemas/ProfitRow' } }
    ExportFile:
      type: object
      required: [fileName, content, rows]
      properties:
        fileName: { type: string }
        content: { type: string, description: CSV text }
        rows: { type: integer }
    ExportLogItem:
      type: object
      required: [id, at, by, kind, from, to, rows]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        by: { type: string }
        kind: { type: string, enum: [invoices, payments, expenses] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        rows: { type: integer }
    BillingOverview:
      type: object
      required: [outstanding, overdue, invoices, quotes, contracts, payments, canAccept]
      properties:
        outstanding: { type: number }
        overdue: { type: number }
        nextDue: { type: object, properties: { invoiceId: { type: string }, number: { type: string }, due: { type: string, format: date }, balance: { type: number } } }
        invoices: { type: array, items: { $ref: '#/components/schemas/InvoiceListItem' } }
        quotes: { type: array, items: { $ref: '#/components/schemas/QuoteListItem' } }
        contracts: { type: array, items: { $ref: '#/components/schemas/ClientContract' } }
        payments: { type: array, items: { $ref: '#/components/schemas/PaymentItem' } }
        canAccept: { type: boolean }
    MetricValue:
      type: object
      required: [key, label, unit]
      properties:
        key: { type: string }
        label: { type: string }
        unit: { type: string, enum: [NUMBER, PERCENT, INR, SECONDS] }
        lowerIsBetter: { type: boolean }
        value: { type: number }
        previous: { type: number }
    ReportSection:
      type: object
      required: [service, metrics]
      properties:
        service: { type: string }
        highlight: { type: string }
        metrics: { type: array, items: { $ref: '#/components/schemas/MetricValue' } }
    ClientReport:
      type: object
      required: [clientId, clientName, month, status, summary, sections, months]
      properties:
        clientId: { type: string }
        clientName: { type: string }
        month: { type: string, description: yyyy-mm; empty when nothing is published yet }
        status: { type: string, enum: [DRAFT, PUBLISHED, NOT_STARTED] }
        summary: { type: string }
        sections: { type: array, items: { $ref: '#/components/schemas/ReportSection' } }
        publishedAt: { type: string, format: date-time }
        publishedBy: { type: string }
        updatedAt: { type: string, format: date-time, description: Staff only }
        updatedBy: { type: string, description: Staff only }
        months: { type: array, items: { type: string }, description: Published months, newest first }
    ReportStatusItem:
      type: object
      required: [clientId, clientName, month, status, services, filled, total]
      properties:
        clientId: { type: string }
        clientName: { type: string }
        month: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, NOT_STARTED] }
        services: { type: array, items: { type: string } }
        filled: { type: integer }
        total: { type: integer }
        updatedAt: { type: string, format: date-time }
    ReportInput:
      type: object
      required: [summary, sections]
      properties:
        summary: { type: string, maxLength: 2000 }
        sections:
          type: array
          items:
            type: object
            required: [service, values]
            properties:
              service: { type: string }
              highlight: { type: string, maxLength: 280 }
              values: { type: object, additionalProperties: { type: number, nullable: true } }

    # ---------- Pipeline, people, time (0.6.0) ----------
    LeadStage: { type: string, enum: [NEW, CONTACTED, PROPOSAL, NEGOTIATION, WON, LOST] }
    LeadSource: { type: string, enum: [WEBSITE, REFERRAL, OFFER, EVENT, OUTBOUND] }
    LeadActivity:
      type: object
      required: [id, at, actor, kind, text]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        kind: { type: string, enum: [CALL, EMAIL, MEETING, NOTE, STAGE, SYSTEM] }
        text: { type: string }
    LeadItem:
      type: object
      required: [id, company, contactName, source, services, value, valueKind, stage, followUpDue, createdAt, daysInStage]
      properties:
        id: { type: string }
        company: { type: string }
        contactName: { type: string }
        city: { type: string }
        source: { $ref: '#/components/schemas/LeadSource' }
        services: { type: array, items: { type: string } }
        value: { type: number, description: 'INR before GST; monthly for retainers' }
        valueKind: { type: string, enum: [MONTHLY, ONE_OFF] }
        stage: { $ref: '#/components/schemas/LeadStage' }
        owner: { $ref: '#/components/schemas/IdName' }
        nextFollowUp: { type: string, format: date }
        followUpDue: { type: boolean }
        createdAt: { type: string, format: date-time }
        daysInStage: { type: integer }
        lostReason: { type: string }
        clientId: { type: string }
    LeadDetail:
      allOf:
        - $ref: '#/components/schemas/LeadItem'
        - type: object
          required: [email, activities]
          properties:
            email: { type: string }
            phone: { type: string }
            notes: { type: string }
            projectId: { type: string }
            activities: { type: array, items: { $ref: '#/components/schemas/LeadActivity' }, description: Newest first }
    PipelineSummary:
      type: object
      required: [stages, openValue, weightedValue, wonThisMonth, followUpsDue, unassigned]
      properties:
        stages: { type: array, items: { type: object, properties: { stage: { $ref: '#/components/schemas/LeadStage' }, count: { type: integer }, value: { type: number } } } }
        openValue: { type: number }
        weightedValue: { type: number, description: 'New 10%, Contacted 20%, Proposal 40%, Negotiation 70%' }
        winRate: { type: number, description: 'Won / (won + lost), last 180 days' }
        wonThisMonth: { type: object, properties: { count: { type: integer }, value: { type: number } } }
        followUpsDue: { type: integer }
        unassigned: { type: integer }
    PipelineBoard:
      type: object
      required: [leads, summary, sellers]
      properties:
        leads: { type: array, items: { $ref: '#/components/schemas/LeadItem' } }
        summary: { $ref: '#/components/schemas/PipelineSummary' }
        sellers: { type: array, items: { $ref: '#/components/schemas/IdName' } }
    NewLead:
      type: object
      required: [company, contactName, email, source, services, value, valueKind]
      properties:
        company: { type: string }
        contactName: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        city: { type: string }
        source: { $ref: '#/components/schemas/LeadSource' }
        services: { type: array, minItems: 1, items: { type: string } }
        value: { type: number, minimum: 0 }
        valueKind: { type: string, enum: [MONTHLY, ONE_OFF] }
        ownerId: { type: string }
        notes: { type: string }
    LeadPatch:
      type: object
      properties:
        stage: { type: string, enum: [NEW, CONTACTED, PROPOSAL, NEGOTIATION, LOST] }
        ownerId: { type: string, description: Empty string removes the owner }
        nextFollowUp: { type: string, format: date }
        value: { type: number }
        services: { type: array, items: { type: string } }
        lostReason: { type: string }
    LeadActivityInput:
      type: object
      required: [kind, text]
      properties:
        kind: { type: string, enum: [CALL, EMAIL, MEETING, NOTE] }
        text: { type: string, minLength: 2, maxLength: 2000 }
        nextFollowUp: { type: string, format: date }
    ConvertLead:
      type: object
      required: [legalName, industry, city, accountManagerId, project]
      properties:
        legalName: { type: string }
        industry: { type: string }
        city: { type: string }
        gstin: { type: string }
        accountManagerId: { type: string }
        ownerTitle: { type: string }
        project:
          type: object
          required: [name, service, ownerId, budgetHours, startDate]
          properties:
            name: { type: string }
            service: { type: string }
            ownerId: { type: string }
            budgetHours: { type: integer, minimum: 1, maximum: 2000 }
            startDate: { type: string, format: date }
    AttendanceStatus: { type: string, enum: [PRESENT, WFH, LEAVE, ABSENT, HOLIDAY, OFF, UPCOMING] }
    AttendanceDay:
      type: object
      required: [date, status]
      properties:
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/AttendanceStatus' }
        checkIn: { type: string, description: 'HH:mm, IST' }
        checkOut: { type: string }
        holiday: { type: string }
    PersonItem:
      type: object
      required: [id, name, role, department, status, today, loggedHours, plannedHours, capacityHours, openTasks, overdueTasks]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        department: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        today: { $ref: '#/components/schemas/AttendanceDay' }
        loggedHours: { type: number }
        plannedHours: { type: number }
        capacityHours: { type: number }
        openTasks: { type: integer }
        overdueTasks: { type: integer }
        nextLeave: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date } } }
    AttendanceWeek:
      type: object
      required: [weekStart, days, people]
      properties:
        weekStart: { type: string, format: date }
        days: { type: array, items: { type: string, format: date } }
        people:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              department: { type: string }
              days: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } }
    LeaveType: { type: string, enum: [CASUAL, SICK, EARNED, UNPAID] }
    LeaveStatus: { type: string, enum: [PENDING, APPROVED, DECLINED, CANCELLED] }
    AffectedTask:
      type: object
      required: [id, title, due, projectName]
      properties:
        id: { type: string }
        title: { type: string }
        due: { type: string, format: date }
        projectName: { type: string }
        suggested: { $ref: '#/components/schemas/IdName' }
    LeaveRequest:
      type: object
      required: [id, userId, userName, department, type, from, to, days, reason, status, createdAt]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        department: { type: string }
        type: { $ref: '#/components/schemas/LeaveType' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        days: { type: integer, description: Working days }
        reason: { type: string }
        status: { $ref: '#/components/schemas/LeaveStatus' }
        createdAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        note: { type: string }
        affectedTasks: { type: array, items: { $ref: '#/components/schemas/AffectedTask' }, description: 'Pending requests, admin area only' }
    LeaveBalance:
      type: object
      required: [type, allowance, used, pending, left]
      properties:
        type: { $ref: '#/components/schemas/LeaveType' }
        allowance: { type: integer }
        used: { type: integer }
        pending: { type: integer }
        left: { type: integer }
    MyLeave:
      type: object
      required: [balances, requests, holidays]
      properties:
        balances: { type: array, items: { $ref: '#/components/schemas/LeaveBalance' } }
        requests: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
        holidays: { type: array, items: { type: object, properties: { date: { type: string, format: date }, name: { type: string } } } }
    NewLeave:
      type: object
      required: [type, from, to, reason]
      properties:
        type: { $ref: '#/components/schemas/LeaveType' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        reason: { type: string, minLength: 3 }
    LeaveDecisionInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [APPROVE, DECLINE] }
        note: { type: string }
        reassign: { type: object, additionalProperties: { type: string }, description: 'taskId -> new assignee id' }
    MyAttendance:
      type: object
      required: [today, month, summary]
      properties:
        today: { $ref: '#/components/schemas/AttendanceDay' }
        month: { type: array, items: { $ref: '#/components/schemas/AttendanceDay' } }
        summary: { type: object, properties: { present: { type: integer }, wfh: { type: integer }, leave: { type: integer }, absent: { type: integer } } }
    WorkloadRow:
      type: object
      required: [id, name, department, capacityHours, leaveHours, plannedHours, loggedHours, load, timesheet, tasks]
      properties:
        id: { type: string }
        name: { type: string }
        department: { type: string }
        capacityHours: { type: number }
        leaveHours: { type: number }
        plannedHours: { type: number }
        loggedHours: { type: number }
        load: { type: number, description: 'planned / (capacity - leave)' }
        timesheet: { type: string, enum: [OPEN, SUBMITTED] }
        tasks: { type: array, items: { type: object, properties: { id: { type: string }, title: { type: string }, due: { type: string, format: date }, hours: { type: number }, projectName: { type: string } } } }
    Workload:
      type: object
      required: [weekStart, rows]
      properties:
        weekStart: { type: string, format: date }
        rows: { type: array, items: { $ref: '#/components/schemas/WorkloadRow' } }
    ScorePoint:
      type: object
      required: [month]
      properties:
        month: { type: string }
        onTimeRate: { type: number }
        utilisation: { type: number }
        firstPassQuality: { type: number }
        clientRating: { type: number }
    Scorecard:
      type: object
      required: [userId, name, department, onTimeDone, onTimeDue, waitingOnClient, billableHours, availableHours, reviewed, trend, notes]
      properties:
        userId: { type: string }
        name: { type: string }
        title: { type: string }
        department: { type: string }
        onTimeRate: { type: number, description: 'Done by due / fell due, last 30 days; tasks with the client excluded' }
        onTimeDone: { type: integer }
        onTimeDue: { type: integer }
        waitingOnClient: { type: integer }
        utilisation: { type: number, description: 'Billable / available hours' }
        billableHours: { type: number }
        availableHours: { type: number }
        firstPassQuality: { type: number }
        reviewed: { type: integer }
        clientRating: { type: number }
        responseMinutes: { type: number }
        trend: { type: array, items: { $ref: '#/components/schemas/ScorePoint' }, description: '5 saved monthly snapshots + this month' }
        notes: { type: array, items: { type: string } }
    TimeEntry:
      type: object
      required: [id, date, projectId, projectName, clientName, minutes, billable]
      properties:
        id: { type: string }
        date: { type: string, format: date }
        projectId: { type: string }
        projectName: { type: string }
        clientName: { type: string }
        taskId: { type: string }
        taskTitle: { type: string }
        minutes: { type: integer }
        note: { type: string }
        billable: { type: boolean }
        running: { type: boolean }
        startedAt: { type: string, format: date-time }
    Timesheet:
      type: object
      required: [weekStart, days, status, entries, totals, projects]
      properties:
        weekStart: { type: string, format: date }
        days: { type: array, items: { type: string, format: date } }
        status: { type: string, enum: [OPEN, SUBMITTED] }
        entries: { type: array, items: { $ref: '#/components/schemas/TimeEntry' } }
        running: { $ref: '#/components/schemas/TimeEntry' }
        totals: { type: object, properties: { minutes: { type: integer }, billableMinutes: { type: integer }, capacityMinutes: { type: integer } } }
        projects:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              clientName: { type: string }
              tasks: { type: array, items: { $ref: '#/components/schemas/IdTitle' } }
    IdTitle: { type: object, properties: { id: { type: string }, title: { type: string } } }
    NewTimeEntry:
      type: object
      required: [date, projectId, minutes]
      properties:
        date: { type: string, format: date }
        projectId: { type: string }
        taskId: { type: string }
        minutes: { type: integer, minimum: 5, maximum: 720 }
        note: { type: string }
    TimerStart:
      type: object
      required: [projectId]
      properties:
        projectId: { type: string }
        taskId: { type: string }
        note: { type: string }
