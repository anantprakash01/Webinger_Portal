openapi: 3.1.0
info:
  title: Webinger Portal API
  version: 0.6.0
  description: |
    Contract between the React frontend and the Spring Boot backend.
    Week 1 covers sign-in and one dashboard per portal area.
    Week 2 adds projects and tasks.
    Week 3 adds approvals, internal review, the client team, user admin, settings and the auth flows.
    Week 4 adds messages, tickets, uploads and files. Live updates: Phase 0 polls GET .../messages;
    Phase 1 adds Spring WebSocket (STOMP) topics /topic/conversations/{id} and /user/queue/inbox with the same payloads.
    0.6.0 adds the sales pipeline (won deal -> client + project), people (attendance, leave with task
    handover, workload, scorecards) and self-service time tracking, leave and attendance under /me.
    0.5.0 adds finance (invoices with GST, quotes, payments with TDS, expenses, profit, CA export),
    client billing (pay, accept or decline quotes) and monthly client reports.
    0.4.1 adds the admin clients module (list, detail with health score, create, edit, notes).
    Every endpoint below is served by src/api/mock in Phase 0 and by Spring Boot from Phase 1.

    Access rules the backend must enforce on every call:
      - the caller's role decides which endpoints it may call (403 otherwise)
      - every query is filtered by the caller's organisationId
      - CLIENT_REP sees only projects they are a member of, and no invoices unless granted
      - a record the caller may not see answers 404 (not 403), so ids cannot be probed
      - tasks are internal: client, influencer and partner roles get 403 on /tasks
      - items with visibility INTERNAL (activity, comments, files) are never sent to client roles
      - every authenticated request re-checks the account: suspended accounts and sessions issued
        before sessionsRevokedAt (force logout, password reset) get 401
      - users, roles and settings changes are SUPER_ADMIN only; two Super Admins at all times
      - chat: employees see a project channel only when assigned to the project; internal notes
        are never returned to client roles; clients cannot write internal notes
      - files: clients see their own company's CLIENT-visible vault files and deliverables of
        projects they can see; download links are signed and expire after 5 minutes
      - finance: /finance/* is SUPER_ADMIN only. Invoices are numbered only when sent (WEB/yyyy-yy/nnnn,
        no gaps), never deleted (cancelled with a reason; paid ones need a credit note). OVERDUE is derived.
        GST 18%: CGST+SGST when the place of supply is the agency's state (27), IGST otherwise.
      - billing: /billing/* needs a client role plus BILLING_VIEW, own organisation only; drafts and other
        companies' invoices are 404. Only CLIENT_OWNER accepts or declines quotes. Accepting adds a contract
        and drafts the advance invoice (sent by a Super Admin). Online payment is confirmed only by the
        payment gateway's signed webhook (Phase 2).
      - reports: /admin/reports is SUPER_ADMIN and MANAGER; /reports returns PUBLISHED months of the caller's
        organisation only, and reps only see services of projects they belong to.
      - pipeline: /pipeline/* is SUPER_ADMIN and MANAGER; converting a won deal is SUPER_ADMIN only (it creates
        a client login). A lead is owned by a Super Admin or Manager; one open lead per email.
      - people: /people/* is SUPER_ADMIN and MANAGER (Phase 1: managers their teams). Nobody approves their own
        leave; a manager's leave goes to a Super Admin. Cost rates and pay never appear in these responses.
      - me: /me/* is staff only and always the caller's own data (attendance, leave, scorecard, time entries).
      - clients: /clients is SUPER_ADMIN and MANAGER only; creating a client (it issues a login)
        and changing a client's status are SUPER_ADMIN only; lifetimeValue is never sent to managers
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      description: |
        Wrong email and wrong password give the same 401. Five failures in 15 minutes give 429.
        A suspended account with the right password gets 403. SUPER_ADMIN and MANAGER get an
        MfaChallenge instead of a session and must call /auth/mfa/verify.
      responses:
        '200':
          description: Signed in (Session, refresh token also set as an httpOnly cookie) or a two-step challenge.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/MfaChallenge'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the refresh cookie for a new access token
      security: []
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token and clear the cookie
      responses:
        '204': { description: Signed out }
  /me:
    get:
      tags: [auth]
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }

  /dashboard/admin:
    get:
      tags: [dashboard]
      summary: Agency overview. Roles SUPER_ADMIN, MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/client:
    get:
      tags: [dashboard]
      summary: Client home. Roles CLIENT_OWNER, CLIENT_REP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/employee:
    get:
      tags: [dashboard]
      summary: Employee "My day". Role EMPLOYEE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/influencer:
    get:
      tags: [dashboard]
      summary: Influencer home. Role INFLUENCER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfluencerDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/partner:
    get:
      tags: [dashboard]
      summary: Partner home. Role PARTNER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerDashboard' }
        '403': { $ref: '#/components/responses/Problem' }

  /projects:
    get:
      tags: [projects]
      summary: Projects the caller may see. Staff and client roles.
      description: |
        SUPER_ADMIN all; MANAGER projects of their teams; EMPLOYEE projects they are a member of
        or have tasks on; CLIENT_OWNER own organisation; CLIENT_REP projects they are added to.
        openTasks / overdueTasks are omitted for client roles. Default order: ACTIVE first,
        then RED, AMBER, GREEN, then name.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches project, client, service or owner name }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { name: health, in: query, schema: { $ref: '#/components/schemas/Health' } }
        - { name: clientId, in: query, schema: { type: string } }
        - { name: service, in: query, schema: { type: string } }
        - { name: ownerId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: Zero-based }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of projects plus filter choices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '403': { $ref: '#/components/responses/Problem' }
  /projects/{id}:
    get:
      tags: [projects]
      summary: Project with milestones, deliverables, team and activity
      description: |
        Client roles receive only CLIENT-visible activity and no tasks, budgetHours or hoursUsed.
        tasks is present for staff; budgetHours / hoursUsed for the admin area only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks:
    get:
      tags: [tasks]
      summary: Internal tasks. Staff only.
      description: |
        Admin area sees all tasks. With no filter an EMPLOYEE gets tasks assigned to them plus tasks they review.
        Sorted by due date.
      parameters:
        - { name: mine, in: query, schema: { type: boolean }, description: Only tasks assigned to the caller }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:
    get:
      tags: [tasks]
      summary: Task with brief, checklist, files and comments
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tasks]
      summary: Change status, assignee or due date
      description: |
        status: assignee, reviewer or admin area. A clientFacing task can only be moved to
        CLIENT_APPROVAL or DONE by its reviewer or the admin area (internal review rule), otherwise 409.
        assigneeId and due: admin area only (403). assigneeId must be an agency staff member (400).
        Every change is written to the project activity as INTERNAL; moving to CLIENT_APPROVAL also
        adds a CLIENT-visible "sent for your approval" entry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPatch' }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tasks/{id}/checklist/{itemId}:
    patch:
      tags: [tasks]
      summary: Tick or untick a checklist item. Assignee, reviewer or admin area.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tasks/{id}/comments:
    post:
      tags: [tasks]
      summary: Add a comment. Staff only. The UI defaults visibility to INTERNAL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewComment' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskComment' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Finish a two-step sign-in
      security: []
      description: |
        mfaToken is single use and expires after 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mfaToken, code], properties: { mfaToken: { type: string }, code: { type: string, pattern: '^\\d{6}$' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/invites/{token}:
    get:
      tags: [auth]
      summary: Read an invite before accepting it
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteInfo' }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/invites/{token}/accept:
    post:
      tags: [auth]
      summary: Set a password and activate the account
      security: []
      description: |
        Password needs at least 8 characters with a letter and a number. Invite links last 7 days and work once.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8, maxLength: 128 } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a reset link
      security: []
      description: |
        Always 202 for a valid email, whether or not an account exists. Links last 30 minutes and work once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '202': { description: Done }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Choose a new password with a reset token
      security: []
      description: |
        Signs out every existing session of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8, maxLength: 128 } } }
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/review:
    post:
      tags: [tasks]
      summary: Pass or fail internal review. Reviewer or admin area only.
      description: |
        Task must be IN_REVIEW (409 otherwise). FAIL needs a note; the task returns to IN_PROGRESS and its rework count rises.
        PASS on a clientFacing task creates a new approval version for the client (creating the deliverable if needed) and
        moves the task to CLIENT_APPROVAL; otherwise the task becomes DONE. Notes are stored as INTERNAL comments.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /approvals:
    get:
      tags: [approvals]
      summary: Approvals on projects the caller may see. Staff and client roles.
      description: |
        Same visibility as GET /projects/{id}. Sorted PENDING first, then newest.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ApprovalStatus' } }
        - { name: projectId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApprovalItem' } }
        '403': { $ref: '#/components/responses/Problem' }
  /approvals/{id}:
    get:
      tags: [approvals]
      summary: Approval with every version and pinned comment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /approvals/{id}/decision:
    post:
      tags: [approvals]
      summary: Approve or request changes. Client roles only.
      description: |
        Only the latest version of a PENDING approval can be decided (409 otherwise). REQUEST_CHANGES needs a note,
        adds one to revisionsUsed, reopens the linked task with the note as a CLIENT comment, and puts the deliverable
        back IN_PROGRESS. Going past revisionsAllowed is allowed but logged INTERNAL for the project owner to discuss
        extra charges. APPROVE marks the deliverable APPROVED and the linked task DONE.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /approvals/{id}/comments:
    post:
      tags: [approvals]
      summary: Pin a comment to a spot on the latest version
      description: |
        x and y are percentages of the page. Comments on older versions are refused (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPinComment' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PinComment' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /client/team:
    get:
      tags: [client-team]
      summary: The caller's company people and projects. CLIENT_OWNER only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTeam' }
        '403': { $ref: '#/components/responses/Problem' }
  /client/team/invites:
    post:
      tags: [client-team]
      summary: Invite a representative. CLIENT_OWNER only.
      description: |
        Creates a CLIENT_REP in PENDING_APPROVAL. A Webinger Super Admin approves before the invite email is sent.
        Projects must belong to the caller's organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepInvite' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTeamMember' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /client/team/{id}:
    patch:
      tags: [client-team]
      summary: Change a representative's projects, billing access or access. CLIENT_OWNER only.
      description: |
        404 for anyone outside the caller's organisation or not a CLIENT_REP. suspended=true also revokes their sessions.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTeamMember' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/users:
    get:
      tags: [admin]
      summary: All accounts. SUPER_ADMIN only.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccountStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/users/invites:
    post:
      tags: [admin]
      summary: Invite a user. SUPER_ADMIN only.
      description: |
        Role must match the organisation kind (staff roles in the agency, client roles in a client, and so on).
        Sends a 7-day invite link. Two-step sign-in is forced on for SUPER_ADMIN and MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInvite' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a representative a client owner invited, and send the invite
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/suspend:
    post:
      tags: [admin]
      summary: Suspend and sign out everywhere
      description: |
        Refused for yourself and for the last active SUPER_ADMIN (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/reactivate:
    post:
      tags: [admin]
      summary: Lift a suspension
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/reset:
    post:
      tags: [admin]
      summary: Email a password reset link (or re-send the invite)
      description: |
        Admins never see or set passwords.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Done }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/logout:
    post:
      tags: [admin]
      summary: Revoke every session of the user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Done }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/organisations:
    get:
      tags: [admin]
      summary: Organisations for the invite form. SUPER_ADMIN only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organisation' } }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/login-history:
    get:
      tags: [admin]
      summary: Latest 100 sign-in attempts. SUPER_ADMIN only.
      parameters:
        - { name: userId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoginEvent' } }
        '403': { $ref: '#/components/responses/Problem' }

  /settings:
    get:
      tags: [settings]
      summary: Portal settings. Agency staff.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSettings' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [settings]
      summary: Save portal settings. SUPER_ADMIN only.
      description: |
        close after open; at least one day; first reply 1-72 h; resolution 1-720 h and not shorter than first reply;
        manager discount 0-50 %; money limits not negative; revisions 1-10; reminder 1-14 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSettings' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /conversations:
    get:
      tags: [messages]
      summary: Channels the caller may read. Staff and client roles.
      description: |
        One channel per project plus a staff-only team channel. Sorted by latest message.
        awaitingReply (staff only) shows an unanswered client message and its business-hours deadline.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        '403': { $ref: '#/components/responses/Problem' }
  /conversations/{id}/messages:
    get:
      tags: [messages]
      summary: Messages in a channel, oldest first
      description: |
        Internal notes are left out for client roles.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string }, description: Only messages after this message id (catch-up after reconnect) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [messages]
      summary: Send a message or internal note
      description: |
        Text up to 4,000 characters and/or up to 5 uploaded attachments (each upload used once, by its uploader).
        internal=true is staff only (403 for clients). A public staff reply marks open tickets in the channel as first-responded.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /conversations/{id}/read:
    post:
      tags: [messages]
      summary: Read receipts up to and including a message
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [upToId], properties: { upToId: { type: string } } }
      responses:
        '204': { description: Done }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /messages/{id}/ticket:
    post:
      tags: [tickets]
      summary: Turn a client message into a ticket. Staff only.
      description: |
        Only public client messages (400 otherwise); once per message (409). Assigned to the project owner.
        Clocks start at the client's message and count business hours only (settings.responseTimes).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTicket' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tickets:
    get:
      tags: [tickets]
      summary: Tickets in channels the caller may read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TicketStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
        '403': { $ref: '#/components/responses/Problem' }
  /tickets/{id}:
    patch:
      tags: [tickets]
      summary: Change status or owner. Staff only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /availability:
    get:
      tags: [messages]
      summary: Is the team working now? Any signed-in user.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
  /uploads:
    post:
      tags: [messages]
      summary: Upload one file to attach to a message
      description: |
        Images, PDF, Office files, CSV, TXT or ZIP up to 10 MB. Larger videos are shared as links.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }

  /files:
    get:
      tags: [files]
      summary: Brand vault files and approved deliverables the caller may see
      description: |
        Deliverables are approvals with status APPROVED; their versions are the approval versions.
      parameters:
        - { name: folder, in: query, schema: { $ref: '#/components/schemas/FileFolder' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FileItem' } }
        '403': { $ref: '#/components/responses/Problem' }
  /files/{id}:
    get:
      tags: [files]
      summary: File with version history (newest first)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /files/{id}/link:
    post:
      tags: [files]
      summary: Create a signed download link
      description: |
        The link works for 5 minutes and only for the requested version. Phase 1: S3 pre-signed URL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { version: { type: integer, description: Defaults to the current version } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /clients:
    get:
      tags: [clients]
      summary: Client companies. SUPER_ADMIN and MANAGER.
      description: |
        Order: live clients first, then red, amber, green, then lowest score.
        Phase 1: a manager sees only clients of their teams.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Name, industry, city or account manager }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ClientStatus' } }
        - { name: health, in: query, schema: { $ref: '#/components/schemas/Health' } }
        - { name: accountManagerId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ClientListItem' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [clients]
      summary: Add a client and invite its owner. SUPER_ADMIN only.
      description: |
        One transaction: organisation (kind CLIENT), client profile (status ONBOARDING), CLIENT_OWNER account (INVITED)
        and a 7-day invite email. 409 when the company name or the owner's email already exists.
        Phase 2: a won deal in the pipeline calls the same service.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewClient' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /clients/account-managers:
    get:
      tags: [clients]
      summary: Active agency staff who can be account manager or backup
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, title: { type: string } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /clients/{id}:
    get:
      tags: [clients]
      summary: Client record with health factors, contacts, contracts, projects and history
      description: |
        Health rule (same as project health): AMBER when a task on a live project is overdue or an approval
        waits more than 5 days; RED when a milestone is missed, an invoice is 15+ days late or satisfaction <= 2.
        healthScore = 100 minus the factor penalties; it ranks clients but never overrides the level.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: The client's organisationId }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [clients]
      summary: Edit profile, account manager or status
      description: |
        Admin area. Changing status is SUPER_ADMIN only (403 for managers). Account manager and backup must be
        active agency staff and different people. Every change is written to the client's history.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: The client's organisationId }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /clients/{id}/notes:
    post:
      tags: [clients]
      summary: Add an internal note to the client history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: The client's organisationId }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [text], properties: { text: { type: string, minLength: 2, maxLength: 2000 } } }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /finance/summary:
    get:
      tags: [finance]
      summary: 'Money overview: collected, recurring, outstanding, days to collect, 6 months, by service'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinanceSummary' }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/invoices:
    get:
      tags: [finance]
      summary: 'Invoices (drafts first, then overdue)'
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - { name: clientId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 'Number, client or title' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/InvoiceListItem' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [finance]
      summary: 'Create a draft invoice (no number yet)'
      description: |
        Lines must point at projects of the same client. Place of supply comes from the client's GSTIN, else its city.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewInvoice' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/invoices/{id}:
    get:
      tags: [finance]
      summary: 'Invoice with lines, GST split, payments and event trail'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [finance]
      summary: 'Edit a draft'
      description: |
        409 once sent: a sent invoice is a tax document. Cancel it and raise a new one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewInvoice' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /finance/invoices/{id}/send:
    post:
      tags: [finance]
      summary: 'Give the next number and email the billing contacts'
      description: |
        The number is taken from a per-financial-year counter in the same transaction (row lock), so there are no gaps.
        409 when already sent or nobody at the client can receive it.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /finance/invoices/{id}/remind:
    post:
      tags: [finance]
      summary: 'Email a payment reminder (once a day)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /finance/invoices/{id}/cancel:
    post:
      tags: [finance]
      summary: 'Cancel with a reason (kept on record)'
      description: |
        409 when money has been received: issue a credit note instead (Phase 1).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /finance/invoices/{id}/payments:
    post:
      tags: [finance]
      summary: 'Record money received (bank, UPI, cheque, card) with optional TDS'
      description: |
        amount + tds may not exceed the balance; TDS at most 10% of the taxable value; date not in the future.
        The invoice becomes PAID when the balance reaches zero. A receipt (RCPT/yyyy-yy/nnnn) is emailed.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /finance/quotes:
    get:
      tags: [finance]
      summary: 'Quotes'
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/QuoteStatus' } }
        - { name: clientId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/QuoteListItem' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [finance]
      summary: 'Create a draft quote'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewQuote' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/quotes/{id}:
    get:
      tags: [finance]
      summary: 'Quote with lines and event trail'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /finance/quotes/{id}/send:
    post:
      tags: [finance]
      summary: 'Send to the client owner'
      description: |
        409 when the client has no active owner login (only the owner can accept) or the quote has expired.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /finance/payments:
    get:
      tags: [finance]
      summary: 'Payments received, newest first'
      parameters:
        - { name: clientId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PaymentItem' } }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/expenses:
    get:
      tags: [finance]
      summary: 'Expenses'
      parameters:
        - { name: month, in: query, schema: { type: string }, description: 'yyyy-mm' }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/ExpenseCategory' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExpenseItem' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [finance]
      summary: 'Record an expense, optionally charged to a project'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewExpense' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExpenseItem' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/profit:
    get:
      tags: [finance]
      summary: 'Margin per client and per project'
      description: |
        Margin = invoiced before GST - hours x cost rate - direct costs. Cost rates never leave the server.
        Phase 2: hours per person from time entries.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProfitReport' }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/projects:
    get:
      tags: [finance]
      summary: 'A client''s billable projects (for invoice lines)'
      parameters:
        - { name: clientId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string }, service: { type: string } } } }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/export:
    get:
      tags: [finance]
      summary: 'CSV for the accountant (invoices, payments or expenses)'
      description: |
        At most one year per export. Every export is written to the export log (who, what, range, rows).
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [invoices, payments, expenses] } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExportFile' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /finance/exports:
    get:
      tags: [finance]
      summary: 'Export log, newest first'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ExportLogItem' } }
        '403': { $ref: '#/components/responses/Problem' }
  /billing:
    get:
      tags: [billing]
      summary: 'The client''s invoices, quotes, contracts and receipts'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillingOverview' }
        '403': { $ref: '#/components/responses/Problem' }
  /billing/invoices/{id}:
    get:
      tags: [billing]
      summary: 'One invoice (no internal event trail)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /billing/invoices/{id}/pay:
    post:
      tags: [billing]
      summary: 'Pay the balance online'
      description: |
        Phase 0 demo marks it paid. Phase 2: returns a payment-gateway order; the invoice is marked paid only from
        the gateway's signed webhook, never by the browser.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /billing/quotes/{id}:
    get:
      tags: [billing]
      summary: 'One quote'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /billing/quotes/{id}/accept:
    post:
      tags: [billing]
      summary: 'Accept (CLIENT_OWNER only)'
      description: |
        One transaction: quote ACCEPTED, contract added to the client record, advance invoice drafted (automation rule 2).
        409 when expired or already decided.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /billing/quotes/{id}/decline:
    post:
      tags: [billing]
      summary: 'Decline with a reason (CLIENT_OWNER only)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3 } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuoteDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /reports:
    get:
      tags: [reports]
      summary: 'The caller''s published monthly report (latest when no month)'
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: OK
