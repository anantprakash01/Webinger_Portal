      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Company, contact, city or service' }
        - { name: ownerId, in: query, schema: { type: string }, description: 'A user id, or none for unassigned' }
        - { name: source, in: query, schema: { $ref: '#/components/schemas/LeadSource' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineBoard' }
        '403': { $ref: '#/components/responses/Problem' }
  /pipeline/leads:
    post:
      tags: [pipeline]
      summary: 'Add a lead (first follow-up tomorrow)'
      description: |
        409 when an open lead already has this email. Automation rule 1 creates leads from the website form and offer clicks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewLead' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /pipeline/leads/{id}:
    get:
      tags: [pipeline]
      summary: 'Lead with activity history'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
