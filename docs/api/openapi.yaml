      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LeaveRequest' } }
        '403': { $ref: '#/components/responses/Problem' }
  /people/leave/{id}/decision:
    post:
      tags: [people]
      summary: 'Approve (optionally handing over tasks) or decline'
      description: |
        403 for your own leave, and for a manager's leave unless you are a Super Admin. Decline needs a note.
        Handover targets must be active staff who are not away that day; each handover is logged on the project (rule 13).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeaveDecisionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeaveRequest' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /people/workload:
    get:
      tags: [people]
      summary: 'Planned vs available hours per person for one week'
      description: |
        Planned = open tasks due that week (overdue included), 6/4/2 h by priority until tasks carry an estimate; work waiting
        on the client is excluded. Available = working days x 8 h minus approved leave.
      parameters:
        - { name: week, in: query, schema: { type: string, format: date }, description: 'Any day of the week (Monday start); default this week' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workload' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /people/scorecards:
