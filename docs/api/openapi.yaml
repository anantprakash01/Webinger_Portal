openapi: 3.1.0
info:
  title: Webinger Portal API
  version: 0.4.0
  description: |
    Contract between the React frontend and the Spring Boot backend.
    Week 1 covers sign-in and one dashboard per portal area.
    Week 2 adds projects and tasks.
    Week 3 adds approvals, internal review, the client team, user admin, settings and the auth flows.
    Week 4 adds messages, tickets, uploads and files. Live updates: Phase 0 polls GET .../messages;
    Phase 1 adds Spring WebSocket (STOMP) topics /topic/conversations/{id} and /user/queue/inbox with the same payloads.
    Every endpoint below is served by src/api/mock in Phase 0 and by Spring Boot from Phase 1.

    Access rules the backend must enforce on every call:
      - the caller's role decides which endpoints it may call (403 otherwise)
      - every query is filtered by the caller's organisationId
      - CLIENT_REP sees only projects they are a member of, and no invoices unless granted
      - a record the caller may not see answers 404 (not 403), so ids cannot be probed
      - tasks are internal: client, influencer and partner roles get 403 on /tasks
      - items with visibility INTERNAL (activity, comments, files) are never sent to client roles
      - every authenticated request re-checks the account: suspended accounts and sessions issued
        before sessionsRevokedAt (force logout, password reset) get 401
      - users, roles and settings changes are SUPER_ADMIN only; two Super Admins at all times
      - chat: employees see a project channel only when assigned to the project; internal notes
        are never returned to client roles; clients cannot write internal notes
      - files: clients see their own company's CLIENT-visible vault files and deliverables of
        projects they can see; download links are signed and expire after 5 minutes
servers:
  - url: /api/v1
security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      description: |
        Wrong email and wrong password give the same 401. Five failures in 15 minutes give 429.
        A suspended account with the right password gets 403. SUPER_ADMIN and MANAGER get an
        MfaChallenge instead of a session and must call /auth/mfa/verify.
      responses:
        '200':
          description: Signed in (Session, refresh token also set as an httpOnly cookie) or a two-step challenge.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Session'
                  - $ref: '#/components/schemas/MfaChallenge'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/refresh:
    post:
      tags: [auth]
      summary: Exchange the refresh cookie for a new access token
      security: []
      responses:
        '200':
          description: New session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token and clear the cookie
      responses:
        '204': { description: Signed out }
  /me:
    get:
      tags: [auth]
      summary: The signed-in user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }

  /dashboard/admin:
    get:
      tags: [dashboard]
      summary: Agency overview. Roles SUPER_ADMIN, MANAGER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/client:
    get:
      tags: [dashboard]
      summary: Client home. Roles CLIENT_OWNER, CLIENT_REP
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/employee:
    get:
      tags: [dashboard]
      summary: Employee "My day". Role EMPLOYEE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/influencer:
    get:
      tags: [dashboard]
      summary: Influencer home. Role INFLUENCER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InfluencerDashboard' }
        '403': { $ref: '#/components/responses/Problem' }
  /dashboard/partner:
    get:
      tags: [dashboard]
      summary: Partner home. Role PARTNER
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartnerDashboard' }
        '403': { $ref: '#/components/responses/Problem' }

  /projects:
    get:
      tags: [projects]
      summary: Projects the caller may see. Staff and client roles.
      description: |
        SUPER_ADMIN all; MANAGER projects of their teams; EMPLOYEE projects they are a member of
        or have tasks on; CLIENT_OWNER own organisation; CLIENT_REP projects they are added to.
        openTasks / overdueTasks are omitted for client roles. Default order: ACTIVE first,
        then RED, AMBER, GREEN, then name.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Matches project, client, service or owner name }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ProjectStatus' } }
        - { name: health, in: query, schema: { $ref: '#/components/schemas/Health' } }
        - { name: clientId, in: query, schema: { type: string } }
        - { name: service, in: query, schema: { type: string } }
        - { name: ownerId, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: Zero-based }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: One page of projects plus filter choices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectPage' }
        '403': { $ref: '#/components/responses/Problem' }
  /projects/{id}:
    get:
      tags: [projects]
      summary: Project with milestones, deliverables, team and activity
      description: |
        Client roles receive only CLIENT-visible activity and no tasks, budgetHours or hoursUsed.
        tasks is present for staff; budgetHours / hoursUsed for the admin area only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tasks:
    get:
      tags: [tasks]
      summary: Internal tasks. Staff only.
      description: |
        Admin area sees all tasks. With no filter an EMPLOYEE gets tasks assigned to them plus tasks they review.
        Sorted by due date.
      parameters:
        - { name: mine, in: query, schema: { type: boolean }, description: Only tasks assigned to the caller }
        - { name: projectId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TaskStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tasks/{id}:
    get:
      tags: [tasks]
      summary: Task with brief, checklist, files and comments
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [tasks]
      summary: Change status, assignee or due date
      description: |
        status: assignee, reviewer or admin area. A clientFacing task can only be moved to
        CLIENT_APPROVAL or DONE by its reviewer or the admin area (internal review rule), otherwise 409.
        assigneeId and due: admin area only (403). assigneeId must be an agency staff member (400).
        Every change is written to the project activity as INTERNAL; moving to CLIENT_APPROVAL also
        adds a CLIENT-visible "sent for your approval" entry.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPatch' }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tasks/{id}/checklist/{itemId}:
    patch:
      tags: [tasks]
      summary: Tick or untick a checklist item. Assignee, reviewer or admin area.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: itemId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [done]
              properties:
                done: { type: boolean }
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /tasks/{id}/comments:
    post:
      tags: [tasks]
      summary: Add a comment. Staff only. The UI defaults visibility to INTERNAL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewComment' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskComment' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Finish a two-step sign-in
      security: []
      description: |
        mfaToken is single use and expires after 5 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [mfaToken, code], properties: { mfaToken: { type: string }, code: { type: string, pattern: '^\\d{6}$' } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Problem' }
  /auth/invites/{token}:
    get:
      tags: [auth]
      summary: Read an invite before accepting it
      security: []
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InviteInfo' }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/invites/{token}/accept:
    post:
      tags: [auth]
      summary: Set a password and activate the account
      security: []
      description: |
        Password needs at least 8 characters with a letter and a number. Invite links last 7 days and work once.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [password], properties: { password: { type: string, minLength: 8, maxLength: 128 } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '400': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }
  /auth/password/forgot:
    post:
      tags: [auth]
      summary: Email a reset link
      security: []
      description: |
        Always 202 for a valid email, whether or not an account exists. Links last 30 minutes and work once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [email], properties: { email: { type: string, format: email } } }
      responses:
        '202': { description: Done }
        '400': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/password/reset:
    post:
      tags: [auth]
      summary: Choose a new password with a reset token
      security: []
      description: |
        Signs out every existing session of the account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token, password], properties: { token: { type: string }, password: { type: string, minLength: 8, maxLength: 128 } } }
      responses:
        '204': { description: Done }
        '400': { $ref: '#/components/responses/Problem' }
        '410': { $ref: '#/components/responses/Problem' }

  /tasks/{id}/review:
    post:
      tags: [tasks]
      summary: Pass or fail internal review. Reviewer or admin area only.
      description: |
        Task must be IN_REVIEW (409 otherwise). FAIL needs a note; the task returns to IN_PROGRESS and its rework count rises.
        PASS on a clientFacing task creates a new approval version for the client (creating the deliverable if needed) and
        moves the task to CLIENT_APPROVAL; otherwise the task becomes DONE. Notes are stored as INTERNAL comments.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /approvals:
    get:
      tags: [approvals]
      summary: Approvals on projects the caller may see. Staff and client roles.
      description: |
        Same visibility as GET /projects/{id}. Sorted PENDING first, then newest.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ApprovalStatus' } }
        - { name: projectId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApprovalItem' } }
        '403': { $ref: '#/components/responses/Problem' }
  /approvals/{id}:
    get:
      tags: [approvals]
      summary: Approval with every version and pinned comment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /approvals/{id}/decision:
    post:
      tags: [approvals]
      summary: Approve or request changes. Client roles only.
      description: |
        Only the latest version of a PENDING approval can be decided (409 otherwise). REQUEST_CHANGES needs a note,
        adds one to revisionsUsed, reopens the linked task with the note as a CLIENT comment, and puts the deliverable
        back IN_PROGRESS. Going past revisionsAllowed is allowed but logged INTERNAL for the project owner to discuss
        extra charges. APPROVE marks the deliverable APPROVED and the linked task DONE.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /approvals/{id}/comments:
    post:
      tags: [approvals]
      summary: Pin a comment to a spot on the latest version
      description: |
        x and y are percentages of the page. Comments on older versions are refused (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewPinComment' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PinComment' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /client/team:
    get:
      tags: [client-team]
      summary: The caller's company people and projects. CLIENT_OWNER only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTeam' }
        '403': { $ref: '#/components/responses/Problem' }
  /client/team/invites:
    post:
      tags: [client-team]
      summary: Invite a representative. CLIENT_OWNER only.
      description: |
        Creates a CLIENT_REP in PENDING_APPROVAL. A Webinger Super Admin approves before the invite email is sent.
        Projects must belong to the caller's organisation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepInvite' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTeamMember' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /client/team/{id}:
    patch:
      tags: [client-team]
      summary: Change a representative's projects, billing access or access. CLIENT_OWNER only.
      description: |
        404 for anyone outside the caller's organisation or not a CLIENT_REP. suspended=true also revokes their sessions.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RepPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientTeamMember' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /admin/users:
    get:
      tags: [admin]
      summary: All accounts. SUPER_ADMIN only.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AccountStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AdminUser' } }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/users/invites:
    post:
      tags: [admin]
      summary: Invite a user. SUPER_ADMIN only.
      description: |
        Role must match the organisation kind (staff roles in the agency, client roles in a client, and so on).
        Sends a 7-day invite link. Two-step sign-in is forced on for SUPER_ADMIN and MANAGER.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInvite' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/approve:
    post:
      tags: [admin]
      summary: Approve a representative a client owner invited, and send the invite
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/suspend:
    post:
      tags: [admin]
      summary: Suspend and sign out everywhere
      description: |
        Refused for yourself and for the last active SUPER_ADMIN (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/reactivate:
    post:
      tags: [admin]
      summary: Lift a suspension
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/reset:
    post:
      tags: [admin]
      summary: Email a password reset link (or re-send the invite)
      description: |
        Admins never see or set passwords.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Done }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{id}/logout:
    post:
      tags: [admin]
      summary: Revoke every session of the user
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Done }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/organisations:
    get:
      tags: [admin]
      summary: Organisations for the invite form. SUPER_ADMIN only.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Organisation' } }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/login-history:
    get:
      tags: [admin]
      summary: Latest 100 sign-in attempts. SUPER_ADMIN only.
      parameters:
        - { name: userId, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/LoginEvent' } }
        '403': { $ref: '#/components/responses/Problem' }

  /settings:
    get:
      tags: [settings]
      summary: Portal settings. Agency staff.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSettings' }
        '403': { $ref: '#/components/responses/Problem' }
    put:
      tags: [settings]
      summary: Save portal settings. SUPER_ADMIN only.
      description: |
        close after open; at least one day; first reply 1-72 h; resolution 1-720 h and not shorter than first reply;
        manager discount 0-50 %; money limits not negative; revisions 1-10; reminder 1-14 days.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PortalSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortalSettings' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /conversations:
    get:
      tags: [messages]
      summary: Channels the caller may read. Staff and client roles.
      description: |
        One channel per project plus a staff-only team channel. Sorted by latest message.
        awaitingReply (staff only) shows an unanswered client message and its business-hours deadline.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Conversation' } }
        '403': { $ref: '#/components/responses/Problem' }
  /conversations/{id}/messages:
    get:
      tags: [messages]
      summary: Messages in a channel, oldest first
      description: |
        Internal notes are left out for client roles.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: after, in: query, schema: { type: string }, description: Only messages after this message id (catch-up after reconnect) }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ChatMessage' } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [messages]
      summary: Send a message or internal note
      description: |
        Text up to 4,000 characters and/or up to 5 uploaded attachments (each upload used once, by its uploader).
        internal=true is staff only (403 for clients). A public staff reply marks open tickets in the channel as first-responded.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewMessage' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /conversations/{id}/read:
    post:
      tags: [messages]
      summary: Read receipts up to and including a message
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [upToId], properties: { upToId: { type: string } } }
      responses:
        '204': { description: Done }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /messages/{id}/ticket:
    post:
      tags: [tickets]
      summary: Turn a client message into a ticket. Staff only.
      description: |
        Only public client messages (400 otherwise); once per message (409). Assigned to the project owner.
        Clocks start at the client's message and count business hours only (settings.responseTimes).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewTicket' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /tickets:
    get:
      tags: [tickets]
      summary: Tickets in channels the caller may read
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TicketStatus' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Ticket' } }
        '403': { $ref: '#/components/responses/Problem' }
  /tickets/{id}:
    patch:
      tags: [tickets]
      summary: Change status or owner. Staff only.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /availability:
    get:
      tags: [messages]
      summary: Is the team working now? Any signed-in user.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Availability' }
  /uploads:
    post:
      tags: [messages]
      summary: Upload one file to attach to a message
      description: |
        Images, PDF, Office files, CSV, TXT or ZIP up to 10 MB. Larger videos are shared as links.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '413': { $ref: '#/components/responses/Problem' }

  /files:
    get:
      tags: [files]
      summary: Brand vault files and approved deliverables the caller may see
      description: |
        Deliverables are approvals with status APPROVED; their versions are the approval versions.
      parameters:
        - { name: folder, in: query, schema: { $ref: '#/components/schemas/FileFolder' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/FileItem' } }
        '403': { $ref: '#/components/responses/Problem' }
  /files/{id}:
    get:
      tags: [files]
      summary: File with version history (newest first)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileDetail' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /files/{id}/link:
    post:
      tags: [files]
      summary: Create a signed download link
      description: |
        The link works for 5 minutes and only for the requested version. Phase 1: S3 pre-signed URL.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { version: { type: integer, description: Defaults to the current version } } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DownloadLink' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }

  responses:
    Problem:
      description: Error in RFC 9457 format (Spring ProblemDetail)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [status, title]
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }

    Role:
      type: string
      enum: [SUPER_ADMIN, MANAGER, EMPLOYEE, CLIENT_OWNER, CLIENT_REP, INFLUENCER, PARTNER]
    Health: { type: string, enum: [GREEN, AMBER, RED] }
    TaskStatus: { type: string, enum: [TODO, IN_PROGRESS, IN_REVIEW, CLIENT_APPROVAL, DONE] }
    InvoiceStatus: { type: string, enum: [DRAFT, SENT, PAID, OVERDUE, CANCELLED] }
    ProjectStatus: { type: string, enum: [ACTIVE, ON_HOLD, COMPLETED] }
    Priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
    Visibility:
      type: string
      enum: [INTERNAL, CLIENT]
      description: INTERNAL items are never returned to client roles. Default INTERNAL.
    MilestoneStatus: { type: string, enum: [DONE, UPCOMING, MISSED] }
    DeliverableStatus: { type: string, enum: [PLANNED, IN_PROGRESS, IN_REVIEW, CLIENT_APPROVAL, APPROVED] }

    User:
      type: object
      required: [id, name, email, role, organisationId, organisationName]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        organisationId: { type: string }
        organisationName: { type: string }
        title: { type: string }
        permissions:
          type: array
          items: { type: string, enum: [BILLING_VIEW, TEAM_MANAGE] }
          description: Grants on top of the role
    Session:
      type: object
      required: [user, accessToken, expiresAt]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }

    Milestone:
      type: object
      required: [title, due]
      properties:
        title: { type: string }
        due: { type: string, format: date }
    ProjectSummary:
      type: object
      required: [id, name, clientName, service, progress, health, owner]
      properties:
        id: { type: string }
        name: { type: string }
        clientName: { type: string }
        service: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        health: { $ref: '#/components/schemas/Health' }
        nextMilestone: { $ref: '#/components/schemas/Milestone' }
        owner: { type: string }
    TaskItem:
      type: object
      required: [id, title, projectId, projectName, clientName, status, priority, due, assigneeId, assigneeName]
      properties:
        id: { type: string }
        title: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        clientName: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        due: { type: string, format: date }
        assigneeId: { type: string }
        assigneeName: { type: string }
        checklistDone: { type: integer }
        checklistTotal: { type: integer }
        commentCount: { type: integer }
        reviewerId: { type: string }
    Approval:
      type: object
      required: [id, title, projectName, submittedAt, revisionsUsed, revisionsAllowed]
      properties:
        id: { type: string }
        title: { type: string }
        projectName: { type: string }
        submittedAt: { type: string, format: date-time }
        revisionsUsed: { type: integer }
        revisionsAllowed: { type: integer }
    InvoiceSummary:
      type: object
      required: [id, number, clientName, amount, due, status]
      properties:
        id: { type: string }
        number: { type: string }
        clientName: { type: string }
        amount: { type: number, description: Amount in INR including GST }
        due: { type: string, format: date }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
    MessagePreview:
      type: object
      required: [id, from, projectName, text, at, unread]
      properties:
        id: { type: string }
        from: { type: string }
        projectName: { type: string }
        text: { type: string }
        at: { type: string, format: date-time }
        unread: { type: boolean }
    KpiPoint:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
        change: { type: string }
        good: { type: boolean }

    AdminDashboard:
      type: object
      required: [revenueThisMonth, recurringRevenue, outstanding, overdueTasks, activeClients, satisfaction, healthMix, projectsAtRisk, overdueInvoices, teamLoad, pipeline, waitingOnYou]
      properties:
        revenueThisMonth: { type: number }
        recurringRevenue: { type: number }
        outstanding: { type: number }
        overdueTasks: { type: integer }
        activeClients: { type: integer }
        satisfaction: { type: number }
        healthMix:
          type: object
          properties:
            GREEN: { type: integer }
            AMBER: { type: integer }
            RED: { type: integer }
        projectsAtRisk: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        overdueInvoices: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } }
        teamLoad:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              department: { type: string }
              assignedHours: { type: number }
              capacityHours: { type: number }
        pipeline:
          type: array
          items:
            type: object
            properties:
              stage: { type: string }
              count: { type: integer }
              value: { type: number }
        waitingOnYou:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              kind: { type: string, enum: [PAYOUT, DISCOUNT, PAUSE, LEAVE] }

    ClientDashboard:
      type: object
      required: [accountManager, projects, approvals, unpaidInvoices, results, resultsPeriod, messages]
      properties:
        accountManager:
          type: object
          properties:
            name: { type: string }
            email: { type: string }
            phone: { type: string }
            hours: { type: string }
        projects: { type: array, items: { $ref: '#/components/schemas/ProjectSummary' } }
        approvals: { type: array, items: { $ref: '#/components/schemas/Approval' } }
        unpaidInvoices: { type: array, items: { $ref: '#/components/schemas/InvoiceSummary' } }
        results: { type: array, items: { $ref: '#/components/schemas/KpiPoint' } }
        resultsPeriod: { type: string }
        messages: { type: array, items: { $ref: '#/components/schemas/MessagePreview' } }
        offer:
          type: object
          properties:
            id: { type: string }
            title: { type: string }
            text: { type: string }
            cta: { type: string }

    EmployeeDashboard:
      type: object
      required: [today, thisWeek, reviewQueue, messages, scorecard, announcements]
      properties:
        today: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        thisWeek: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        reviewQueue: { type: array, items: { $ref: '#/components/schemas/TaskItem' } }
        messages: { type: array, items: { $ref: '#/components/schemas/MessagePreview' } }
        scorecard:
          type: object
          properties:
            onTimeRate: { type: number }
            firstPassQuality: { type: number }
            clientRating: { type: number }
            hoursLogged: { type: number }
            hoursCapacity: { type: number }
        announcements:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              at: { type: string, format: date }

    InfluencerDashboard:
      type: object
      required: [verification, profileCompleteness, invites, active, payouts]
      properties:
        verification: { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        profileCompleteness: { type: integer }
        invites:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              brand: { type: string }
              campaign: { type: string }
              deliverable: { type: string }
              fee: { type: number }
              respondBy: { type: string, format: date }
        active:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              brand: { type: string }
              campaign: { type: string }
              step: { type: string }
              due: { type: string, format: date }
        payouts:
          type: object
          properties:
            pending: { type: number }
            paidThisYear: { type: number }

    PartnerDashboard:
      type: object
      required: [briefs, invoices]
      properties:
        briefs:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              projectName: { type: string }
              due: { type: string, format: date }
              status: { type: string, enum: [NEW, IN_PROGRESS, SUBMITTED, APPROVED] }
        invoices:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              number: { type: string }
              amount: { type: number }
              status: { $ref: '#/components/schemas/InvoiceStatus' }

    # ---------- Week 2: projects and tasks ----------
    ProjectListItem:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [status, clientId, ownerId, startDate]
          properties:
            status: { $ref: '#/components/schemas/ProjectStatus' }
            clientId: { type: string, description: The client organisation id }
            ownerId: { type: string }
            startDate: { type: string, format: date }
            endDate: { type: string, format: date }
            openTasks: { type: integer, description: Staff only }
            overdueTasks: { type: integer, description: Staff only }
    ProjectPage:
      type: object
      required: [items, page, size, totalItems, totalPages, facets]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ProjectListItem' } }
        page: { type: integer, description: Zero-based }
        size: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
        facets:
          type: object
          description: Filter choices drawn from every project the caller may see, not just this page
          required: [services, owners, clients]
          properties:
            services: { type: array, items: { type: string } }
            owners: { type: array, items: { $ref: '#/components/schemas/IdName' } }
            clients: { type: array, items: { $ref: '#/components/schemas/IdName' } }
    IdName:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    MilestoneItem:
      type: object
      required: [id, title, due, status]
      properties:
        id: { type: string }
        title: { type: string }
        due: { type: string, format: date }
        status: { $ref: '#/components/schemas/MilestoneStatus' }
        completedAt: { type: string, format: date }
    Deliverable:
      type: object
      required: [id, title, status, due, revisionsUsed, revisionsAllowed]
      properties:
        id: { type: string }
        title: { type: string }
        milestoneId: { type: string }
        status: { $ref: '#/components/schemas/DeliverableStatus' }
        due: { type: string, format: date }
        revisionsUsed: { type: integer }
        revisionsAllowed: { type: integer }
    TeamMember:
      type: object
      required: [id, name, title, projectRole]
      properties:
        id: { type: string }
        name: { type: string }
        title: { type: string }
        projectRole: { type: string, enum: [OWNER, BACKUP, MEMBER, CLIENT] }
    ActivityItem:
      type: object
      required: [id, at, actor, text, visibility]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor: { type: string }
        text: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    ProjectDetail:
      allOf:
        - $ref: '#/components/schemas/ProjectListItem'
        - type: object
          required: [scope, milestones, deliverables, team, activity]
          properties:
            scope: { type: string }
            milestones: { type: array, items: { $ref: '#/components/schemas/MilestoneItem' } }
            deliverables: { type: array, items: { $ref: '#/components/schemas/Deliverable' } }
            team: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
            activity: { type: array, items: { $ref: '#/components/schemas/ActivityItem' }, description: Newest first }
            tasks: { type: array, items: { $ref: '#/components/schemas/TaskItem' }, description: Staff only }
            budgetHours: { type: number, description: Admin area only }
            hoursUsed: { type: number, description: Admin area only }
    ChecklistItem:
      type: object
      required: [id, text, done]
      properties:
        id: { type: string }
        text: { type: string }
        done: { type: boolean }
    TaskFile:
      type: object
      required: [id, name, sizeKb, uploadedBy, uploadedAt, visibility]
      properties:
        id: { type: string }
        name: { type: string }
        sizeKb: { type: integer }
        uploadedBy: { type: string }
        uploadedAt: { type: string, format: date-time }
        visibility: { $ref: '#/components/schemas/Visibility' }
    TaskComment:
      type: object
      required: [id, authorId, author, at, text, visibility]
      properties:
        id: { type: string }
        authorId: { type: string }
        author: { type: string }
        at: { type: string, format: date-time }
        text: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskItem'
        - type: object
          required: [description, clientFacing, checklist, files, comments, createdAt]
          properties:
            description: { type: string }
            reviewerId: { type: string }
            reviewerName: { type: string }
            clientFacing: { type: boolean, description: Must pass internal review before reaching the client }
            checklist: { type: array, items: { $ref: '#/components/schemas/ChecklistItem' } }
            files: { type: array, items: { $ref: '#/components/schemas/TaskFile' } }
            comments: { type: array, items: { $ref: '#/components/schemas/TaskComment' }, description: Oldest first }
            createdAt: { type: string, format: date-time }
    TaskPatch:
      type: object
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/TaskStatus' }
        assigneeId: { type: string }
        due: { type: string, format: date }
    NewComment:
      type: object
      required: [text, visibility]
      properties:
        text: { type: string, minLength: 1, maxLength: 2000 }
        visibility: { $ref: '#/components/schemas/Visibility' }

    # ---------- Week 3 ----------
    MfaChallenge:
      type: object
      required: [mfaRequired, mfaToken, method]
      properties:
        mfaRequired: { type: boolean, enum: [true] }
        mfaToken: { type: string }
        method: { type: string }
    InviteInfo:
      type: object
      required: [name, email, role, organisationName, expiresAt]
      properties:
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        organisationName: { type: string }
        expiresAt: { type: string, format: date-time }
    ReviewInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [PASS, FAIL] }
        note: { type: string, maxLength: 2000, description: Required (5+ characters) for FAIL }
    ApprovalStatus: { type: string, enum: [PENDING, APPROVED, CHANGES_REQUESTED] }
    AssetKind: { type: string, enum: [IMAGE, PDF] }
    ApprovalItem:
      type: object
      required: [id, title, projectId, projectName, kind, status, versionNumber, submittedAt, thumbnailUrl, revisionsUsed, revisionsAllowed, commentCount]
      properties:
        id: { type: string }
        title: { type: string }
        projectId: { type: string }
        projectName: { type: string }
        kind: { $ref: '#/components/schemas/AssetKind' }
        status: { $ref: '#/components/schemas/ApprovalStatus' }
        versionNumber: { type: integer }
        submittedAt: { type: string, format: date-time }
        thumbnailUrl: { type: string, description: Short-lived signed link }
        revisionsUsed: { type: integer }
        revisionsAllowed: { type: integer }
        commentCount: { type: integer }
    ApprovalDecision:
      type: object
      required: [status, byName, at]
      properties:
        status: { type: string, enum: [APPROVED, CHANGES_REQUESTED] }
        byName: { type: string }
        at: { type: string, format: date-time }
        note: { type: string }
    AssetVersion:
      type: object
      required: [id, number, fileName, pages, submittedAt, submittedBy]
      properties:
        id: { type: string }
        number: { type: integer }
        fileName: { type: string }
        pages: { type: array, items: { type: string }, description: Preview image per page (PDFs rendered server-side), signed links }
        submittedAt: { type: string, format: date-time }
        submittedBy: { type: string }
        note: { type: string }
        decision: { $ref: '#/components/schemas/ApprovalDecision' }
    PinComment:
      type: object
      required: [id, versionId, page, x, y, authorId, author, fromAgency, at, text]
      properties:
        id: { type: string }
        versionId: { type: string }
        page: { type: integer, minimum: 0 }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        authorId: { type: string }
        author: { type: string }
        fromAgency: { type: boolean }
        at: { type: string, format: date-time }
        text: { type: string }
    ApprovalDetail:
      allOf:
        - $ref: '#/components/schemas/ApprovalItem'
        - type: object
          required: [deliverableId, clientName, versions, comments]
          properties:
            deliverableId: { type: string }
            clientName: { type: string }
            versions: { type: array, items: { $ref: '#/components/schemas/AssetVersion' }, description: Oldest first }
            comments: { type: array, items: { $ref: '#/components/schemas/PinComment' }, description: Oldest first }
    ApprovalDecisionInput:
      type: object
      required: [versionId, decision]
      properties:
        versionId: { type: string }
        decision: { type: string, enum: [APPROVE, REQUEST_CHANGES] }
        note: { type: string, maxLength: 2000, description: Required (5+ characters) for REQUEST_CHANGES }
    NewPinComment:
      type: object
      required: [versionId, page, x, y, text]
      properties:
        versionId: { type: string }
        page: { type: integer, minimum: 0 }
        x: { type: number, minimum: 0, maximum: 100 }
        y: { type: number, minimum: 0, maximum: 100 }
        text: { type: string, minLength: 1, maxLength: 1000 }
    AccountStatus: { type: string, enum: [ACTIVE, INVITED, PENDING_APPROVAL, SUSPENDED] }
    ClientTeamMember:
      type: object
      required: [id, name, email, role, status, projectIds, canSeeBilling]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        title: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        projectIds: { type: array, items: { type: string } }
        canSeeBilling: { type: boolean }
        invitedAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    ClientTeam:
      type: object
      required: [members, projects]
      properties:
        members: { type: array, items: { $ref: '#/components/schemas/ClientTeamMember' } }
        projects: { type: array, items: { $ref: '#/components/schemas/IdName' } }
    RepInvite:
      type: object
      required: [name, email, projectIds, canSeeBilling]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        title: { type: string }
        projectIds: { type: array, minItems: 1, items: { type: string } }
        canSeeBilling: { type: boolean }
    RepPatch:
      type: object
      minProperties: 1
      properties:
        projectIds: { type: array, minItems: 1, items: { type: string } }
        canSeeBilling: { type: boolean }
        suspended: { type: boolean }
    AdminUser:
      type: object
      required: [id, name, email, role, organisationId, organisationName, status, mfaEnabled, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        organisationId: { type: string }
        organisationName: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/AccountStatus' }
        mfaEnabled: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
        invitedBy: { type: string }
    UserInvite:
      type: object
      required: [name, email, role, organisationId]
      properties:
        name: { type: string, minLength: 2 }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        organisationId: { type: string }
        title: { type: string }
    Organisation:
      type: object
      required: [id, name, kind]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [AGENCY, CLIENT, INFLUENCER, PARTNER] }
    LoginEvent:
      type: object
      required: [id, userName, email, at, result, ip, device]
      properties:
        id: { type: string }
        userId: { type: string }
        userName: { type: string }
        email: { type: string }
        at: { type: string, format: date-time }
        result: { type: string, enum: [SUCCESS, FAILED, MFA_FAILED, LOCKED] }
        ip: { type: string }
        device: { type: string }
    PortalSettings:
      type: object
      required: [businessHours, responseTimes, approvalLimits, defaultRevisions, reminderAfterDays]
      properties:
        businessHours:
          type: object
          required: [days, open, close, timezone]
          properties:
            days: { type: array, items: { type: integer, minimum: 0, maximum: 6 }, description: 0 = Sunday }
            open: { type: string, pattern: '^\\d{2}:\\d{2}$' }
            close: { type: string, pattern: '^\\d{2}:\\d{2}$' }
            timezone: { type: string }
        responseTimes:
          type: object
          required: [firstReplyHours, ticketResolutionHours]
          properties:
            firstReplyHours: { type: integer }
            ticketResolutionHours: { type: integer }
        approvalLimits:
          type: object
          required: [managerDiscountPercent, managerSpendLimit, deputyPayoutLimit]
          properties:
            managerDiscountPercent: { type: number }
            managerSpendLimit: { type: number, description: INR }
            deputyPayoutLimit: { type: number, description: INR }
        defaultRevisions: { type: integer }
        reminderAfterDays: { type: integer }

    # ---------- Week 4 ----------
    Attachment:
      type: object
      required: [id, name, sizeKb, kind]
      properties:
        id: { type: string }
        name: { type: string }
        sizeKb: { type: integer }
        kind: { type: string, enum: [IMAGE, PDF, DOC, OTHER] }
        url: { type: string, description: Short-lived signed link }
    ReadReceipt:
      type: object
      required: [userId, name, at]
      properties:
        userId: { type: string }
        name: { type: string }
        at: { type: string, format: date-time }
    ChatMessage:
      type: object
      required: [id, conversationId, authorId, authorName, fromAgency, at, text, internal, attachments, readBy]
      properties:
        id: { type: string }
        conversationId: { type: string }
        authorId: { type: string }
        authorName: { type: string }
        fromAgency: { type: boolean }
        at: { type: string, format: date-time }
        text: { type: string }
        internal: { type: boolean, description: Staff-only note; never sent to client roles }
        attachments: { type: array, items: { $ref: '#/components/schemas/Attachment' } }
        readBy: { type: array, items: { $ref: '#/components/schemas/ReadReceipt' } }
        ticketId: { type: string }
        ticketNumber: { type: string }
    Conversation:
      type: object
      required: [id, kind, title, unreadCount, openTickets, members]
      properties:
        id: { type: string }
        kind: { type: string, enum: [PROJECT, TEAM] }
        title: { type: string }
        projectId: { type: string }
        clientName: { type: string }
        unreadCount: { type: integer }
        lastMessage:
          type: object
          properties:
            text: { type: string }
            at: { type: string, format: date-time }
            authorName: { type: string }
            internal: { type: boolean }
        awaitingReply:
          type: object
          description: Staff only
          properties:
            since: { type: string, format: date-time }
            dueAt: { type: string, format: date-time }
        openTickets: { type: integer }
        members:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              fromAgency: { type: boolean }
    NewMessage:
      type: object
      required: [text, internal, attachmentIds]
      properties:
        text: { type: string, maxLength: 4000 }
        internal: { type: boolean }
        attachmentIds: { type: array, maxItems: 5, items: { type: string } }
    TicketStatus: { type: string, enum: [OPEN, WAITING_ON_CLIENT, RESOLVED] }
    Ticket:
      type: object
      required: [id, number, title, conversationId, messageId, projectName, clientName, status, priority, assigneeId, assigneeName, createdAt, createdBy, firstResponseDueAt, resolveDueAt]
      properties:
        id: { type: string }
        number: { type: string, example: TCK-0042 }
        title: { type: string }
        conversationId: { type: string }
        messageId: { type: string }
        projectName: { type: string }
        clientName: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/Priority' }
        assigneeId: { type: string }
        assigneeName: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { type: string }
        firstResponseDueAt: { type: string, format: date-time }
        firstRespondedAt: { type: string, format: date-time }
        resolveDueAt: { type: string, format: date-time }
        resolvedAt: { type: string, format: date-time }
    NewTicket:
      type: object
      required: [title, priority]
      properties:
        title: { type: string, minLength: 3, maxLength: 120 }
        priority: { $ref: '#/components/schemas/Priority' }
    TicketPatch:
      type: object
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/TicketStatus' }
        assigneeId: { type: string }
    Availability:
      type: object
      required: [openNow, hoursText, firstReplyHours]
      properties:
        openNow: { type: boolean }
        opensAt: { type: string, format: date-time }
        hoursText: { type: string, example: 'Mon–Sat, 10:00–19:00 IST' }
        firstReplyHours: { type: integer }
    FileFolder: { type: string, enum: [LOGOS, FONTS, GUIDELINES, PHOTOS, DELIVERABLES] }
    FileVersion:
      type: object
      required: [number, sizeKb, uploadedAt, uploadedBy]
      properties:
        number: { type: integer }
        sizeKb: { type: integer }
        uploadedAt: { type: string, format: date-time }
        uploadedBy: { type: string }
        note: { type: string }
        previewUrl: { type: string }
    FileItem:
      type: object
      required: [id, name, folder, kind, currentVersion, versionCount, sizeKb, updatedAt, updatedBy]
      properties:
        id: { type: string }
        name: { type: string }
        folder: { $ref: '#/components/schemas/FileFolder' }
        kind: { type: string, enum: [IMAGE, PDF, DOC, OTHER, FONT] }
        projectId: { type: string }
        projectName: { type: string }
        currentVersion: { type: integer }
        versionCount: { type: integer }
        sizeKb: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
        previewUrl: { type: string }
    FileDetail:
      allOf:
        - $ref: '#/components/schemas/FileItem'
        - type: object
          required: [versions]
          properties:
            versions: { type: array, items: { $ref: '#/components/schemas/FileVersion' }, description: Newest first }
    DownloadLink:
      type: object
      required: [url, fileName, expiresAt]
      properties:
        url: { type: string }
        fileName: { type: string }
        expiresAt: { type: string, format: date-time }
