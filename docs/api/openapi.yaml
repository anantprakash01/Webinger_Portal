  /admin/reports/{clientId}/{month}/publish:
    post:
      tags: [reports]
      summary: 'Publish to the client and email them'
      description: |
        400 lists every missing number (automation rule 11 turns these into tasks). Needs a summary; not for the current month.
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
