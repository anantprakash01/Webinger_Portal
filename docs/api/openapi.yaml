      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ReportStatusItem' } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /admin/reports/{clientId}/{month}:
    get:
      tags: [reports]
      summary: 'One report for editing (empty skeleton if not started)'
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientReport' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [reports]
      summary: 'Save numbers (draft, or a correction to a published month)'
      description: |
        Values are numbers >= 0, percentages <= 100, null = not entered. Only services the client buys.
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: string } }
