      summary: 'Move stage, change owner, follow-up, value or services'
      description: |
        WON only through /convert. LOST needs lostReason. Won deals are closed (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /pipeline/leads/{id}/activities:
    post:
      tags: [pipeline]
      summary: 'Log a call, email, meeting or note'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadActivityInput' }
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /pipeline/leads/{id}/convert:
    post:
      tags: [pipeline]
      summary: 'Mark as won: create the client, invite the contact, start the first project'
      description: |
        SUPER_ADMIN only. One transaction through the same service as POST /clients (duplicate name or email -> 409,
        the lead stays open), then the project, then the lead is WON (automation rules 2 and 3).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConvertLead' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadDetail' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /people:
    get:
      tags: [people]
      summary: 'Staff with today''s attendance, this week''s load and upcoming leave'
